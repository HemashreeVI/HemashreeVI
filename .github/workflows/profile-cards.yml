name: Generate achievements and streak cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      # GitHub achievements card (scraped from the public profile; keeps the last card on failure)
      - run: python3 repo/scripts/achievements.py ${{ github.repository_owner }} dist/achievements.svg
      # Contribution streak card. The script draws stats and top-languages cards from the same
      # request; the README only shows the streak, so those two are dropped before publishing.
      - run: |
          python3 repo/scripts/stats_cards.py ${{ github.repository_owner }} dist
          rm -f dist/stats.svg dist/top-langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishes dist/ as the whole output branch (achievements.svg, streak.svg)
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
