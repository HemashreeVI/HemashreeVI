name: Generate Snake, Pac-Man and activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-lavender.svg?palette=github-dark&color_snake=#D9CEFF&color_dots=#1C1630,#3E3463,#5B4A9A,#7B61D9,#B7A4F2
      # Pac-Man eating the contribution grid. Same job as the snake: the deploy
      # step below replaces the whole output branch with dist/.
      - uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
      # Activity line graph, drawn here instead of relying on an external service
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: python3 repo/scripts/activity_graph.py ${{ github.repository_owner }} dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub achievements card (scraped from the public profile; keeps the last card on failure)
      - run: python3 repo/scripts/achievements.py ${{ github.repository_owner }} dist/achievements.svg
      # Trophy card: ranked stats from the GraphQL API (keeps the last card on failure)
      - run: python3 repo/scripts/trophies.py ${{ github.repository_owner }} dist/trophies.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
