sans" font-size="13" fill="#9A93B4" text-anchor="start" >Marina Bay Sands, Singapore.</text><rect x="78" y="308" width="64" height="24" rx="12" fill="#0B0912" stroke="#B7A4F2"/><text x="110" y="324" class="mono" font-size="10.5" fill="#D9CEFF" text-anchor="middle" letter-spacing="1.5">IBM</text><text x="190" y="322" class="serif" font-size="20" fill="#E8E6F0" text-anchor="start" >Generative AI certification</text><text x="190" y="344" class="sans" font-size="13" fill="#9A93B4" text-anchor="start" >Gen AI Using IBM watsonx.</text><rect x="78" y="374" width="64" height="24" rx="12" fill="#0B0912" stroke="#B7A4F2"/><text x="110" y="390" class="mono" font-size="10.5" fill="#D9CEFF" text-anchor="middle" letter-spacing="1.5">日本語</text><text x="190" y="388" class="serif" font-size="20" fill="#E8E6F0" text-anchor="start" >Japanese</text><text x="190" y="410" class="sans" font-size="13" fill="#9A93B4" text-anchor="start" >Studied Japanese as a subject at VIT Chennai.</text><rect x="78" y="440" width="64" height="24" rx="12" fill="#0B0912" stroke="#B7A4F2"/><text x="110" y="456" class="mono" font-size="10.5" fill="#D9CEFF" text-anchor="middle" letter-spacing="1.5">LEAD</text><text x="190" y="454" class="serif" font-size="20" fill="#E8E6F0" text-anchor="start" >Leadership</text><text x="190" y="476" class="sans" font-size="13" fill="#9A93B4" text-anchor="start" >Team Leader, CodeYGen Club · Design Lead, Fitness Club.</text>
