<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-labelledby="mile-t mile-d">
<title id="mile-t">Milestones</title>
<desc id="mile-d">Co-inventor · filing in progress: IoT-Enabled Smart Walker with Sensor-Fusion Fall Risk Prediction and Adaptive Mobility Assistance. Inventive disclosure filed with IIPRD.; Research Intern, VIT Chennai: Human pose estimation with MMPose, validated against Kinovea ground truth (May–Jul 2025).; National University of Singapore: Introduction to Industry 4.0 Programme (Jun 2025).; SuperAI 2025: Marina Bay Sands, Singapore.; Generative AI certification: Gen AI Using IBM watsonx.; Japanese: Studied Japanese as a subject at VIT Chennai.; Leadership: Team Leader, CodeYGen Club · Design Lead, Fitness Club.</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#B7A4F2}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="mile-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#1C1630"/>
    <stop offset=".55" stop-color="#14101F"/>
    <stop offset="1" stop-color="#0B0912"/>
  </radialGradient>
  <radialGradient id="mile-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7B61D9" stop-opacity=".45"/>
    <stop offset="1" stop-color="#7B61D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mile-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E8E6F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E8E6F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mile-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C9C5D8"/>
    <stop offset="1" stop-color="#B7A4F2"/>
  </linearGradient>
  <linearGradient id="mile-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B7A4F2" stop-opacity="0"/>
    <stop offset=".25" stop-color="#B7A4F2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#B7A4F2" stop-opacity="0"/>
  </linearGradient>
  <pattern id="mile-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#B7A4F2" stroke-opacity=".05"/>
  </pattern>
  <filter id="mile-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<rect x="1" y="1" width="1198" height="510" rx="22" fill="url(#mile-bg)" stroke="#2D2647"/>
<rect x="1" y="1" width="1198" height="510" rx="22" fill="url(#mile-grid)"/>
<ellipse cx="960" cy="154" rx="420" ry="358" fill="url(#mile-glowA)"/>
