</g><text x="120" y="54" class="mono" font-size="10.5" fill="#839DFB" text-anchor="start" letter-spacing="2.5">04 · CHROME EXTENSION</text><text x="119" y="86" class="serif" font-size="27" fill="url(#ext3-silver)" text-anchor="start" >Contributions Decoded</text><text x="120" y="110" class="serif" font-size="14.5" fill="#C5CAD8" text-anchor="start" font-style="italic">GitHub profiles in plain English.</text><circle cx="34" cy="136" r="3" fill="#8FE3C8"/><text x="46" y="140" class="sans" font-size="12.5" fill="#E6E9F0" text-anchor="start" >explains commits, PRs, +/- lines</text><circle cx="34" cy="157" r="3" fill="#839DFB"/><text x="46" y="161" class="sans" font-size="12.5" fill="#E6E9F0" text-anchor="start" >streaks, busiest day, monthly chart</text><circle cx="34" cy="178" r="3" fill="#F0A8D0"/><text x="46" y="182" class="sans" font-size="12.5" fill="#E6E9F0" text-anchor="start" >works on any profile</text><rect x="28" y="196" width="89" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="39" y="212" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >DOM parsing</text>
<rect x="125.1" y="196" width="59" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="136.1" y="212" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >no API</text>
