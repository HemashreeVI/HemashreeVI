</g><text x="120" y="54" class="mono" font-size="10.5" fill="#C9CED6" text-anchor="start" letter-spacing="2.5">05 · CHROME EXTENSION</text><text x="119" y="86" class="serif" font-size="27" fill="url(#ext4-silver)" text-anchor="start" >WorkSync</text><text x="120" y="110" class="serif" font-size="14.5" fill="#C6C9CF" text-anchor="start" font-style="italic">My Chrome work, backed up to GitHub.</text><circle cx="34" cy="136" r="3" fill="#A6DCC5"/><text x="46" y="140" class="sans" font-size="12.5" fill="#F3F4F6" text-anchor="start" >Docs, Sheets, Slides, Colab + code</text><circle cx="34" cy="157" r="3" fill="#C9CED6"/><text x="46" y="161" class="sans" font-size="12.5" fill="#F3F4F6" text-anchor="start" >one commit per thing I do</text><circle cx="34" cy="178" r="3" fill="#E3A6B4"/><text x="46" y="182" class="sans" font-size="12.5" fill="#F3F4F6" text-anchor="start" >a daily journal, private repo</text><rect x="28" y="196" width="95" height="24" rx="12" fill="#121316" stroke="#3B3E45"/><text x="39" y="212" class="mono" font-size="10" fill="#C6C9CF" text-anchor="start" >Git Data API</text>
