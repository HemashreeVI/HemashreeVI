<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-labelledby="tool-t tool-d">
<title id="tool-t">Tech and tools</title>
<desc id="tool-d">Languages: Python · Java, C++ · JavaScript, SQL; Frontend: HTML · CSS, JavaScript, Three.js · Canvas, Gradio; Backend &amp; Devops: Spring Boot, FastAPI · Flask, Docker · Kafka · Redis, Prometheus · Grafana, GitHub Actions · k6; Motion &amp; Design: Canva, CSS keyframes, SVG animation, Three.js 3D, Poster design; Ai &amp; Vision: PyTorch, TensorFlow · OpenCV, YOLOv8/v9 · Grad-CAM, MMPose · Q-learning, RAG · Ollama · watsonx; Data: PostgreSQL, SQLite · MySQL, Redis · Qdrant, Firebase; Embedded &amp; Iot: Arduino · ESP32, Raspberry Pi, Sensor fusion, LIDAR SLAM; Security: Threat modeling, Intrusion detection, Risk scoring; Tools: Git · GitHub, VS Code · Linux, Jupyter · Colab, Kaggle · Roboflow, Windows · PowerShell; Spoken: Tamil · English, Hindi, 日本語</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#839DFB}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="tool-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#161C30"/>
    <stop offset=".55" stop-color="#10131F"/>
    <stop offset="1" stop-color="#090B12"/>
  </radialGradient>
  <radialGradient id="tool-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#416AE6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#416AE6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tool-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6E9F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E6E9F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tool-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C5CAD8"/>
    <stop offset="1" stop-color="#839DFB"/>
  </linearGradient>
  <linearGradient id="tool-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#839DFB" stop-opacity="0"/>
    <stop offset=".25" stop-color="#839DFB" stop-opacity=".8"/>
    <stop offset="1" stop-color="#839DFB" stop-opacity="0"/>
  </linearGradient>
  <pattern id="tool-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#839DFB" stroke-opacity=".05"/>
  </pattern>
  <filter id="tool-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

