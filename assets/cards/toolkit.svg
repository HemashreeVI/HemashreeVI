uino · Raspberry Pi</text><text x="620" y="142" class="serif" font-size="19" fill="#E8E6F0" text-anchor="start" >ESP32</text><text x="620" y="173" class="serif" font-size="17" fill="#C9C5D8" text-anchor="start" >Sensor fusion</text><text x="620" y="202" class="serif" font-size="15" fill="#9A93B4" text-anchor="start" >LIDAR SLAM</text><rect x="620" y="252" width="40" height="2" rx="1" fill="#B7A4F2"><animate attributeName="width" values="40;231;40" dur="8s" repeatCount="indefinite"/></rect><rect x="884" y="32" width="271" height="232" rx="16" fill="#17122A" stroke="#3E3463"/><text x="904" y="64" class="mono" font-size="11" fill="#B7A4F2" text-anchor="start" letter-spacing="2.5">04 BACKEND &amp; DEVOPS</text><text x="904" y="106" class="serif" font-size="24" fill="#E8E6F0" text-anchor="start" >FastAPI · Flask</text><text x="904" y="142" class="serif" font-size="19" fill="#E8E6F0" text-anchor="start" >Docker · Kafka</text><text x="904" y="173" class="serif" font-size="17" fill="#C9C5D8" text-anchor="start" >Prometheus · Grafana</text><text x="904" y="202" class="serif" font-size="15" fill="#9A93B4" text-anchor="start" >GitHub Actions</text><rect x="904" y="252" width="40" height="2" rx="1" fill="#B7A4F2"><animate attributeName="width" values="40;231;40" dur="9s" repeatCount="indefinite"/></rect><rect x="32" y="280" width="271" height="232" rx="16" fill="#17122A" stroke="#3E3463"/><text x="52" y="312" class="mono" font-size="11" fill="#B7A4F2" text-anchor="start" letter-spacing="2.5">05 DATA</text><text x="52" y="354" class="serif" font-size="24" fill="#E8E6F0" text-anchor="start" >SQLite · MySQL</text><text x="52" y="390" class="serif" font-size="19" fill="#E8E6F0" text-anchor="start" >Firebase</text><text x="52" y="421" class="serif" font-size="17" fill="#C9C5D8" text-anchor="start" >Qdrant</text><rect x="52" y="500" width="40" height="2" rx="1" fill="#B7A4F2"><animate attributeName="width" values="40;231;40" dur="10s" repeatCount="indefinite"/></rect><rect x="316" y=