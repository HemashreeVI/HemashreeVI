<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-labelledby="proj-t proj-d">
<title id="proj-t">Smart Grocer</title>
<desc id="proj-d">Smart Grocer: Knows which mango will spoil first. Fresh-produce spoilage detection · item localization · expiry-aware retail inventory. Spoilage detection; Localize items on the shelf; Expiry-aware inventory. Tech: Python, OpenCV, Raspberry Pi, Multimodal</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#C77B9B}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="proj-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#2A0E1B"/>
    <stop offset=".55" stop-color="#190B12"/>
    <stop offset="1" stop-color="#10070C"/>
  </radialGradient>
  <radialGradient id="proj-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#701A3D" stop-opacity=".45"/>
    <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="proj-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F8F0F3" stop-opacity=".12"/>
    <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="proj-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#D8C4CD"/>
    <stop offset="1" stop-color="#C77B9B"/>
  </linearGradient>
  <linearGradient id="proj-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
    <stop offset=".25" stop-color="#C77B9B" stop-opacity=".8"/>
    <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="proj-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".05"/>
  </pattern>
  <filter id="proj-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>


<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-bg)" stroke="#3A1828"/>
<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-grid)"/>
<ellipse cx="960" cy="127" rx="420" ry="223" fill="url(#proj-glowA)"/>
<ellipse cx="240" cy="191" rx="300" ry="159" fill="url(#proj-glowB)"/>
<defs><linearGradient id="proj-risk" x1="0" x2="1"><stop offset="0" stop-color="#8FE3C8"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient></defs>
<text x="40" y="44" class="mono" font-size="11" fill="#C77B9B" text-anchor="start" letter-spacing="3">06 · MULTIMODAL · RETAIL</text>
<text x="38" y="96" class="serif" font-size="44" fill="url(#proj-silver)" text-anchor="start" >Smart Grocer</text>
<text x="40" y="128" class="serif" font-size="17" fill="#D8C4CD" text-anchor="start" font-style="italic">Knows which mango will spoil first.</text>
<text x="40" y="154" class="mono" font-size="12" fill="#B6A3AC" text-anchor="start" >BUILT › Fresh-produce spoilage detection · item localization · expiry-aware retail inventory</text>
<rect x="40" y="186" width="680" height="1" fill="#4E2236"/>
<text x="40" y="222" class="serif" font-size="30" fill="#F8F0F3" text-anchor="start" >Spoilage</text><text x="40" y="245" class="sans" font-size="13" fill="#B6A3AC" text-anchor="start" >detection</text><text x="265" y="222" class="serif" font-size="30" fill="#F8F0F3" text-anchor="start" >Localize</text><text x="265" y="245" class="sans" font-size="13" fill="#B6A3AC" text-anchor="start" >items on the shelf</text><text x="490" y="222" class="serif" font-size="30" fill="#F8F0F3" text-anchor="start" >Expiry-aware</text><text x="490" y="245" class="sans" font-size="13" fill="#B6A3AC" text-anchor="start" >inventory</text>
<rect x="40" y="264" width="60" height="24" rx="12" fill="#1F0C16" stroke="#4E2236"/><text x="51" y="280" class="mono" font-size="10.5" fill="#D8C4CD" text-anchor="start" >Python</text>
<rect x="108.43" y="264" width="60" height="24" rx="12" fill="#1F0C16" stroke="#4E2236"/><text x="119.43" y="280" class="mono" font-size="10.5" fill="#D8C4CD" text-anchor="start" >OpenCV</text>
<rect x="176.86" y="264" width="99" height="24" rx="12" fill="#1F0C16" stroke="#4E2236"/><text x="187.86" y="280" class="mono" font-size="10.5" fill="#D8C4CD" text-anchor="start" >Raspberry Pi</text>
<rect x="283.72" y="264" width="86" height="24" rx="12" fill="#1F0C16" stroke="#4E2236"/><text x="294.72" y="280" class="mono" font-size="10.5" fill="#D8C4CD" text-anchor="start" >Multimodal</text>
<g class="float"><rect x="850" y="54" width="310" height="200" rx="16" fill="#10070C" stroke="#4E2236"/><circle cx="886" cy="98" r="16" fill="#8FE3C8" fill-opacity=".2" stroke="#8FE3C8"/><text x="914" y="94" class="mono" font-size="12" fill="#F8F0F3" text-anchor="start" >mango</text><text x="1142" y="94" class="mono" font-size="10" fill="#8FE3C8" text-anchor="end" >expires 4d</text><rect x="914" y="102" width="228" height="6" rx="3" fill="#1F0C16"/><rect x="914" y="102" width="0" height="6" rx="3" fill="#8FE3C8"><animate attributeName="width" values="0;194;194" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/></rect><circle cx="886" cy="152" r="16" fill="#C77B9B" fill-opacity=".2" stroke="#C77B9B"/><text x="914" y="148" class="mono" font-size="12" fill="#F8F0F3" text-anchor="start" >tomato</text><text x="1142" y="148" class="mono" font-size="10" fill="#C77B9B" text-anchor="end" >expires 2d</text><rect x="914" y="156" width="228" height="6" rx="3" fill="#1F0C16"/><rect x="914" y="156" width="0" height="6" rx="3" fill="#C77B9B"><animate attributeName="width" values="0;125;125" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/></rect><circle cx="886" cy="206" r="16" fill="#FF8FB1" fill-opacity=".2" stroke="#FF8FB1"/><text x="914" y="202" class="mono" font-size="12" fill="#F8F0F3" text-anchor="start" >banana</text><text x="1142" y="202" class="mono" font-size="10" fill="#FF8FB1" text-anchor="end" >expires today</text><rect x="914" y="210" width="228" height="6" rx="3" fill="#1F0C16"/><rect x="914" y="210" width="0" height="6" rx="3" fill="#FF8FB1"><animate attributeName="width" values="0;46;46" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/></rect></g>

</svg>
