roke-dasharray="2 5"/><text x="1150" y="196" class="mono" font-size="10.5" fill="#C77B9B" text-anchor="end" letter-spacing="2">PLANNED</text><rect x="32" y="230" width="1136" height="54" rx="14" fill="#1F0C16" stroke="#4E2236"/><text x="56" y="264" class="mono" font-size="12" fill="#7C6570" text-anchor="start" >04</text><text x="96" y="265" class="serif" font-size="20" fill="#F8F0F3" text-anchor="start" >Pit Wall</text><text x="300" y="263" class="sans" font-size="14" fill="#B6A3AC" text-anchor="start" >Replay real F1 races with a GPS track map and live leaderboard</text><path d="M900 257H1020" stroke="#C77B9B" stroke-opacity=".5" stroke-dasharray="2 5"/><text x="1150" y="262" class="mono" font-size="10.5" fill="#C77B9B" text-anchor="end" letter-spacing="2">PLANNED</text><rect x="32" y="296" width="1136" height="54" rx="14" fill="#1F0C16" stroke="#4E2236"/><text x="56" y="330" class="mono" font-size="12" fill="#7C6570" text-anchor="start" >05</text><text x="96" y="331" class="serif" font-size="20" fill="#F8F0F3" text-anchor="start" >LeetCode Solutions</text><text x="300" y="329" class="sans" font-size="14" fill="#B6A3AC" text-anchor="start" >Clean, commented Java solutions, intuition first</text><circle class="pulse" cx="908" cy="323" r="4" fill="#FF8FB1"/><text x="1150" y="328" class="mono" font-size="10.5" fill="#FF8FB1" text-anchor="end" letter-spacing="2">DAILY</text>
