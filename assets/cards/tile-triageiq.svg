="middle" >P3 · feature</text><text x="18" y="186" class="mono" font-size="10" fill="#8FE3C8" text-anchor="start" >draft ready · waiting for approval</text></g></g><text x="28" y="44" class="mono" font-size="10" fill="#839DFB" text-anchor="start" letter-spacing="2">LLM · STREAMING</text><text x="27" y="80" class="serif" font-size="28" fill="url(#pt2-silver)" text-anchor="start" >TriageIQ</text><text x="28" y="108" class="serif" font-size="14.5" fill="#C5CAD8" text-anchor="start" font-style="italic">Sorts every support email and drafts a</text><text x="28" y="128" class="serif" font-size="14.5" fill="#C5CAD8" text-anchor="start" font-style="italic">grounded reply, fully on-device.</text><rect x="28" y="170" width="524" height="1" fill="#2B3963"/><text x="28" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >3B</text><text x="28" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >local model, data stays</text><text x="28" y="236" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >local</text><text x="206" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >Top 3</text><text x="206" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >similar past tickets</text><text x="384" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >0</text><text x="384" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >emails sent unapproved</text><rect x="28" y="254" width="59" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="39" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >Python</text>
<rect x="94.6" y="254" width="52" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="105.6" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >Kafka</text>
<rect x="155.1" y="254" width="59" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="166.1" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >Ollama</text>
<rect x="221.7" y="254" width="59" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="232.7" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >Qdrant</text>
<rect x="288.29999999999995" y="254" width="65" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="299.29999999999995" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >FastAPI</text><text x="558" y="292" class="mono" font-size="11" fill="#939BB4" text-anchor="end" >open ↗</text>
</svg>
