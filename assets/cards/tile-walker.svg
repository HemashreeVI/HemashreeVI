</rect></g></g><text x="28" y="44" class="mono" font-size="10" fill="#839DFB" text-anchor="start" letter-spacing="2">PATENT 01 · IoT · FILING IN PROGRESS</text><text x="27" y="80" class="serif" font-size="28" fill="url(#pt5-silver)" text-anchor="start" >Smart Walker</text><text x="28" y="108" class="serif" font-size="14.5" fill="#C5CAD8" text-anchor="start" font-style="italic">A walker that predicts a fall before it</text><text x="28" y="128" class="serif" font-size="14.5" fill="#C5CAD8" text-anchor="start" font-style="italic">happens.</text><rect x="28" y="170" width="524" height="1" fill="#2B3963"/><text x="28" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >2× IMU</text><text x="28" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >+ load cells, fused</text><text x="206" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >&lt; $30</text><text x="206" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >standalone on Arduino</text><text x="384" y="202" class="serif" font-size="22" fill="#E6E9F0" text-anchor="start" >Patent</text><text x="384" y="222" class="sans" font-size="11" fill="#939BB4" text-anchor="start" >co-inventor</text><rect x="28" y="254" width="65" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="39" y="270" class="mono" font-size="10" fill="#C5CAD8" text-anchor="start" >Arduino</text>
