<circle class="twinkle" cx="850" cy="292" r="1.6" fill="#F3F4F6" style="animation-delay:3.9s"/>
<circle class="twinkle" cx="625" cy="179" r="0.8" fill="#F3F4F6" style="animation-delay:3.2s"/>
<text x="600" y="64" class="mono" font-size="12" fill="#C9CED6" text-anchor="middle" letter-spacing="4">LET'S BUILD SOMETHING THAT KEEPS PEOPLE SAFE</text>
<text x="600" y="168" class="serif" font-size="96" font-style="italic" text-anchor="middle" fill="url(#foot-silver)" letter-spacing="2">Hemashree</text>
<text x="600" y="168" class="serif" font-size="96" font-style="italic" text-anchor="middle" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="120 900" letter-spacing="2" opacity=".8">Hemashree<animate attributeName="stroke-dashoffset" values="1020;0" dur="6s" repeatCount="indefinite"/></text>
<rect x="380" y="196" width="440" height="1.2" fill="url(#foot-rule)"/>
<text x="600" y="236" class="sans" font-size="15" fill="#C6C9CF" text-anchor="middle" >Open to roles in cybersecurity · computer vision · cyber-physical systems · backend &amp; devops</text>
<text x="600" y="280" class="serif" font-size="20" fill="#EEF0F3" text-anchor="middle" >よろしくお願いします</text>

