<circle class="twinkle" cx="1069" cy="185" r="1" fill="#F3F4F6" style="animation-delay:2.5s"/>
<circle class="twinkle" cx="1166" cy="97" r="0.8" fill="#F3F4F6" style="animation-delay:0.3s"/>
