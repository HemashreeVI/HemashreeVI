<rect x="108.43" y="264" width="54" height="24" rx="12" fill="#17122A" stroke="#3E3463"/><text x="119.43" y="280" class="mono" font-size="10.5" fill="#C9C5D8" text-anchor="start" >Kafka</text>
<rect x="170.455" y="264" width="67" height="24" rx="12" fill="#17122A" stroke="#3E3463"/><text x="181.455" y="280" class="mono" font-size="10.5" fill="#C9C5D8" text-anchor="start" >FastAPI</text>
<rect x="245.29000000000002" y="264" width="60" height="24" rx="12" fill="#17122A" stroke="#3E3463"/><text x="256.29" y="280" class="mono" font-size="10.5" fill="#C9C5D8" text-anchor="start" >Docker</text>
<rect x="313.72" y="264" width="60" height="24" rx="12" fill="#17122A" stroke="#3E3463"/><text x="324.72" y="280" class="mono" font-size="10.5" fill="#C9C5D8" text-anchor="start" >Ollama</text>
<rect x="382.15000000000003" y="264" width="60" height="24" rx="12" fill="#17122A" stroke="#3E3463"/><text x="393.15000000000003" y="280" class="mono" font-size="10.5" fill="#C9C5D8" text-anchor="start" >Qdrant</text>
<g class="float"><rect x="850" y="54" width="310" height="200" rx="16" fill="#0B0912" stroke="#3E3463"/><text x="868" y="80" class="mono" font-size="10" fill="#9A93B4" text-anchor="start" >kafka://tickets</text><rect x="970" y="124" width="70" height="60" rx="12" fill="#17122A" stroke="#B7A4F2"/><text x="1005" y="152" class="mono" font-size="13" fill="#E8E6F0" text-anchor="middle" >LLM</text><text x="1005" y="170" class="mono" font-size="10" fill="#B7A4F2" text-anchor="middle" >+ RAG</text><rect width="40" height="22" rx="5" fill="#17122A" stroke="#E8E6F0" stroke-opacity=".5"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M860 143H960"/></rect><rect width="40" height="22" rx="5" fill="#17122A" stroke="#E8E6F0" stroke-opacity=".5"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M860 143H960"/></rect><rect width="40" height="22" rx="5" fill="#17122A" stroke="#E8E6F0" stroke-opacity=".5"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M860 143H960"/></rect><path d="M1040 154L1064 106" stroke="#F0A8D0" stroke-opacity=".5"/><rect x="1064" y="94" width="84" height="24" rx="12" fill="none" stroke="#F0A8D0"/><text x="1106" y="110" class="mono" font-size="10" fill="#F0A8D0" text-anchor="middle" >P1 · billing</text><path d="M1040 154L1064 154" stroke="#B7A4F2" stroke-opacity=".5"/><rect x="1064" y="142" width="84" height="24" rx="12" fill="none" stroke="#B7A4F2"/><text x="1106" y="158" class="mono" font-size="10" fill="#B7A4F2" text-anchor="middle" >P2 · login</text><path d="M1040 154L1064 202" stroke="#8FE3C8" stroke-opacity=".5"/><rect x="1064" y="190" width="84" height="24" rx="12" fill="none" stroke="#8FE3C8"/><text x="1106" y="206" class="mono" font-size="10" fill="#8FE3C8" text-anchor="middle" >P3 · feature</text><text x="868" y="240" class="mono" font-size="10" fill="#8FE3C8" text-anchor="start" >draft reply ready · 0.4s</text></g>

