<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-labelledby="proj-t proj-d">
<title id="proj-t">TriageIQ</title>
<desc id="proj-d">TriageIQ: Sorts every support email and drafts a grounded reply, fully on-device. Kafka pipeline · local LLM classifies with a safe fallback · RAG over solved tickets · human approves every reply. 3B local model, data stays local; Top 3 similar past tickets; 0 emails sent unapproved. Tech: Python, Kafka, Ollama, Qdrant, FastAPI, Docker, SSE</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#A4C5F2}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="proj-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#162130"/>
    <stop offset=".55" stop-color="#10161F"/>
    <stop offset="1" stop-color="#090D12"/>
  </radialGradient>
  <radialGradient id="proj-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#6197D9" stop-opacity=".45"/>
    <stop offset="1" stop-color="#6197D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="proj-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6EBF0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E6EBF0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="proj-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C5CED8"/>
    <stop offset="1" stop-color="#A4C5F2"/>
  </linearGradient>
  <linearGradient id="proj-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A4C5F2" stop-opacity="0"/>
    <stop offset=".25" stop-color="#A4C5F2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#A4C5F2" stop-opacity="0"/>
  </linearGradient>
  <pattern id="proj-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#A4C5F2" stroke-opacity=".05"/>
  </pattern>
  <filter id="proj-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>


<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-bg)" stroke="#263547"/>
<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-grid)"/>
<ellipse cx="960" cy="127" rx="420" ry="223" fill="url(#proj-glowA)"/>
<ellipse cx="240" cy="191" rx="300" ry="159" fill="url(#proj-glowB)"/>
<defs><linearGradient id="proj-risk" x1="0" x2="1"><stop offset="0" stop-color="#8FE3C8"/><stop offset="1" stop-color="#F0A8D0"/></linearGradient></defs>
<text x="40" y="44" class="mono" font-size="11" fill="#A4C5F2" text-anchor="start" letter-spacing="3">03 · LLM · STREAMING</text>
<text x="38" y="96" class="serif" font-size="44" fill="url(#proj-silver)" text-anchor="start" >TriageIQ</text>
<text x="40" y="128" class="serif" font-size="17" fill="#C5CED8" text-anchor="start" font-style="italic">Sorts every support email and drafts a grounded reply, fully on-device.</text>
<text x="40" y="154" class="mono" font-size="12" fill="#93A2B4" text-anchor="start" >BUILT › Kafka pipeline · local LLM classifies with a safe fallback · RAG over solved tickets</text><text x="40" y="172" class="mono" font-size="12" fill="#93A2B4" text-anchor="start" >         · human approves every reply</text>
<rect x="40" y="186" width="680" height="1" fill="#344963"/>
<text x="40" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >3B</text><text x="40" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >local model, data stays local</text><text x="265" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >Top 3</text><text x="265" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >similar past tickets</text><text x="490" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >0</text><text x="490" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >emails sent unapproved</text>
<rect x="40" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="51" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Python</text>
<rect x="108.43" y="264" width="54" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="119.43" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Kafka</text>
<rect x="170.455" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="181.455" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Ollama</text>
<rect x="238.88500000000002" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="249.88500000000002" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Qdrant</text>
<rect x="307.31500000000005" y="264" width="67" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="318.31500000000005" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >FastAPI</text>
<rect x="382.1500000000001" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="393.1500000000001" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Docker</text>
<rect x="450.5800000000001" y="264" width="41" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="461.5800000000001" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >SSE</text>
<g class="float"><rect x="850" y="54" width="310" height="200" rx="16" fill="#090D12" stroke="#344963"/><text x="868" y="80" class="mono" font-size="10" fill="#93A2B4" text-anchor="start" >kafka://tickets</text><rect x="970" y="124" width="70" height="60" rx="12" fill="#121D2A" stroke="#A4C5F2"/><text x="1005" y="152" class="mono" font-size="13" fill="#E6EBF0" text-anchor="middle" >LLM</text><text x="1005" y="170" class="mono" font-size="10" fill="#A4C5F2" text-anchor="middle" >+ RAG</text><rect width="40" height="22" rx="5" fill="#121D2A" stroke="#E6EBF0" stroke-opacity=".5"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M860 143H960"/></rect><rect width="40" height="22" rx="5" fill="#121D2A" stroke="#E6EBF0" stroke-opacity=".5"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M860 143H960"/></rect><rect width="40" height="22" rx="5" fill="#121D2A" stroke="#E6EBF0" stroke-opacity=".5"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M860 143H960"/></rect><path d="M1040 154L1064 106" stroke="#F0A8D0" stroke-opacity=".5"/><rect x="1064" y="94" width="84" height="24" rx="12" fill="none" stroke="#F0A8D0"/><text x="1106" y="110" class="mono" font-size="10" fill="#F0A8D0" text-anchor="middle" >P1 · billing</text><path d="M1040 154L1064 154" stroke="#A4C5F2" stroke-opacity=".5"/><rect x="1064" y="142" width="84" height="24" rx="12" fill="none" stroke="#A4C5F2"/><text x="1106" y="158" class="mono" font-size="10" fill="#A4C5F2" text-anchor="middle" >P2 · login</text><path d="M1040 154L1064 202" stroke="#8FE3C8" stroke-opacity=".5"/><rect x="1064" y="190" width="84" height="24" rx="12" fill="none" stroke="#8FE3C8"/><text x="1106" y="206" class="mono" font-size="10" fill="#8FE3C8" text-anchor="middle" >P3 · feature</text><text x="868" y="240" class="mono" font-size="10" fill="#8FE3C8" text-anchor="start" >draft ready · waiting for approval</text></g>

