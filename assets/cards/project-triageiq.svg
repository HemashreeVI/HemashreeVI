<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-labelledby="proj-t proj-d">
<title id="proj-t">TriageIQ</title>
<desc id="proj-d">TriageIQ: Support tickets, triaged the moment they arrive. Kafka stream · local LLM classifies and prioritises · RAG over past tickets drafts the reply · live dashboard. Kafka real-time ticket stream; Local LLM classify + prioritise; RAG drafts replies. Tech: Python, Kafka, FastAPI, Docker, Ollama, Qdrant</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#B7A4F2}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="proj-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#1C1630"/>
    <stop offset=".55" stop-color="#14101F"/>
    <stop offset="1" stop-color="#0B0912"/>
  </radialGradient>
  <radialGradient id="proj-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7B61D9" stop-opacity=".45"/>
    <stop offset="1" stop-color="#7B61D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="proj-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E8E6F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E8E6F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="proj-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C9C5D8"/>
    <stop offset="1" stop-color="#B7A4F2"/>
  </linearGradient>
  <linearGradient id="proj-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B7A4F2" stop-opacity="0"/>
    <stop offset=".25" stop-color="#B7A4F2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#B7A4F2" stop-opacity="0"/>
  </linearGradient>
  <pattern id="proj-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#B7A4F2" stroke-opacity=".05"/>
  </pattern>
  <filter id="proj-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>


<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-bg)" stroke="#2D2647"/>
<rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#proj-grid)"/>
<ellipse cx="960" cy="127" rx="420" ry="223" fill="url(#proj-glowA)"/>
<ellipse cx="240" cy="191" rx="300" ry="159" fill="url(#proj-glowB)"/>
<defs><linearGradient id="proj-risk" x1="0" x2="1"><stop offset="0" stop-color="#8FE3C8"/><stop offset="1" stop-color="#F0A8D0"/></linearGradient></defs>
<text x="40" y="44" class="mono" font-size="11" fill="#B7A4F2" text-anchor="start" letter-spacing="3">03 · LLM · STREAMING</text>
<text x="38" y="96" class="serif" font-size="44" fill="url(#proj-silver)" text-anchor="start" >TriageIQ</text>
<text x="40" y="128" class="serif" font-size="17" fill="#C9C5D8" text-anchor="start" font-style="italic">Support tickets, triaged the moment they arrive.</text>
<text x="40" y="154" class="mono" font-size="12" fill="#9A93B4" text-anchor="start" >BUILT › Kafka stream · local LLM classifies and prioritises · RAG over past tickets drafts</text><text x="40" y="172" class="mono" font-size="12" fill="#9A93B4" text-anchor="start" >         the reply · live dashboard</text>
