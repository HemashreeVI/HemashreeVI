  <ellipse cx="0" cy="1" rx="15.0" ry="3.0" fill="url(#pcN-sh)"/><g transform="scale(0.75)" fill="url(#pcN-pc)" stroke="#2A2C31" stroke-width=".8" stroke-linejoin="round"><path d="M-17 0h34v-4c0-2.5-2-4-4.5-4h-25c-2.5 0-4.5 1.5-4.5 4z"/><path d="M-14 -8h28l-2 -3h-24z"/><path d="M-11 -11C-11 -19 -5 -23 -7 -30C-13 -28 -17 -32 -15 -36C-12 -42 -5 -48 1 -52L3 -59L7 -52C14 -47 15 -33 12 -11z"/><circle cx="2" cy="-45" r="1.4" fill="#2A2C31"/><path d="M8 -50C11 -44 11 -36 10 -30" fill="none" stroke="#2A2C31" stroke-width=".8" opacity=".6"/></g>
</g>

