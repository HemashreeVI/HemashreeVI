<text x="40" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >&lt; 2 min</text><text x="40" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >real incident, open to resolved</text><text x="265" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >118</text><text x="265" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >unit tests</text><text x="490" y="222" class="serif" font-size="30" fill="#E6EBF0" text-anchor="start" >5 steps</text><text x="490" y="245" class="sans" font-size="13" fill="#93A2B4" text-anchor="start" >detect → verify</text>
<rect x="40" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="51" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Python</text>
<rect x="108.43" y="264" width="67" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="119.43" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >FastAPI</text>
<rect x="183.26500000000001" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="194.26500000000001" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Docker</text>
<rect x="251.69500000000002" y="264" width="86" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="262.69500000000005" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Prometheus</text>
<rect x="345.745" y="264" width="67" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="356.745" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >Grafana</text>
<rect x="420.58000000000004" y="264" width="105" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="431.58000000000004" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >OpenTelemetry</text>
<rect x="533.845" y="264" width="60" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="544.845" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >SQLite</text>
<rect x="602.2750000000001" y="264" width="35" height="24" rx="12" fill="#121D2A" stroke="#344963"/><text x="613.2750000000001" y="280" class="mono" font-size="10.5" fill="#C5CED8" text-anchor="start" >CI</text>
<g class="float"><rect x="850" y="54" width="310" height="200" rx="16" fill="#090D12" stroke="#344963"/><path d="M910 114L1030 104" stroke="#A4C5F2" stroke-opacity=".35"/><path d="M910 114L960 184" stroke="#A4C5F2" stroke-opacity=".35"/><path d="M960 184L1090 174" stroke="#A4C5F2" stroke-opacity=".35"/><path d="M1030 104L1090 174" stroke="#A4C5F2" stroke-opacity=".35"/><path d="M1090 174L1030 224" stroke="#A4C5F2" stroke-opacity=".35"/><path d="M960 184L1030 224" stroke="#A4C5F2" stroke-opacity=".35"/><circle cx="910" cy="114" r="9" fill="#121D2A" stroke="#A4C5F2" stroke-width="1.5"/><text x="910" y="140" class="mono" font-size="10" fill="#93A2B4" text-anchor="middle" >customer</text><circle cx="1030" cy="104" r="9" fill="#121D2A" stroke="#A4C5F2" stroke-width="1.5"/><text x="1030" y="130" class="mono" font-size="10" fill="#93A2B4" text-anchor="middle" >user</text><circle cx="960" cy="184" r="9" fill="#121D2A" stroke="#A4C5F2" stroke-width="1.5"/><text x="960" y="210" class="mono" font-size="10" fill="#93A2B4" text-anchor="middle" >order</text><circle cx="1090" cy="174" r="12" fill="#121D2A" stroke="#F0A8D0" stroke-width="1.5"/><circle cx="1090" cy="174" r="12" fill="none" stroke="#F0A8D0"><animate attributeName="r" values="12;28" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="1090" y="200" class="mono" font-size="10" fill="#F0A8D0" text-anchor="middle" >payment</text><circle cx="1030" cy="224" r="9" fill="#121D2A" stroke="#A4C5F2" stroke-width="1.5"/><text x="1030" y="250" class="mono" font-size="10" fill="#93A2B4" text-anchor="middle" >sqlite</text><text x="866" y="76" class="mono" font-size="10" fill="#F0A8D0" text-anchor="start" >payment v2 · errors · score 1.00 → rollback</text></g>

