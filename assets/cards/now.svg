<rect x="32" y="28" width="556" height="274" rx="18" fill="#17122A" fill-opacity=".8" stroke="#3E3463"/>
<text x="60" y="60" class="mono" font-size="11" fill="#B7A4F2" text-anchor="start" letter-spacing="3">RIGHT NOW</text>
<text x="60" y="94" class="serif" font-size="26" fill="#E8E6F0" text-anchor="start" >What I'm building</text><circle class="pulse" cx="66" cy="125.0" r="4" fill="#8FE3C8" style="animation-delay:0.0s"/><text x="84" y="130.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">RootLens <tspan fill="#9A93B4" font-weight="400">AI-assisted root-cause analysis for microservices</tspan></text><circle class="pulse" cx="66" cy="172.5" r="4" fill="#8FE3C8" style="animation-delay:0.4s"/><text x="84" y="177.5" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">TriageIQ <tspan fill="#9A93B4" font-weight="400">real-time LLM ticket triage with Kafka and RAG</tspan></text><circle class="pulse" cx="66" cy="220.0" r="4" fill="#8FE3C8" style="animation-delay:0.8s"/><text x="84" y="225.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">Binary search trees in Java <tspan fill="#9A93B4" font-weight="400">and solving LeetCode daily</tspan></text><circle class="pulse" cx="66" cy="267.5" r="4" fill="#8FE3C8" style="animation-delay:1.2000000000000002s"/><text x="84" y="272.5" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">Pit Wall <tspan fill="#9A93B4" font-weight="400">an F1 race replay built on real GPS data</tspan></text>
<rect x="612" y="28" width="556" height="274" rx="18" fill="#17122A" fill-opacity=".8" stroke="#3E3463"/>
<text x="640" y="60" class="mono" font-size="11" fill="#B7A4F2" text-anchor="start" letter-spacing="3">QUICK FACTS</text>
<text x="640" y="94" class="serif" font-size="26" fill="#E8E6F0" text-anchor="start" >Things worth knowing</text><circle class="pulse" cx="646" cy="125.0" r="4" fill="#B7A4F2" style="animation-delay:0.0s"/><text x="664" y="130.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">Co-inventor <tspan fill="#9A93B4" font-weight="400">on a smart walker patent (filing in progress)</tspan></text><circle class="pulse" cx="646" cy="163.0" r="4" fill="#B7A4F2" style="animation-delay:0.4s"/><text x="664" y="168.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">Singapore <tspan fill="#9A93B4" font-weight="400">NUS Industry 4.0 and SuperAI 2025</tspan></text><circle class="pulse" cx="646" cy="201.0" r="4" fill="#B7A4F2" style="animation-delay:0.8s"/><text x="664" y="206.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">31 dental conditions <tspan fill="#9A93B4" font-weight="400">detected on 13,000+ X-rays</tspan></text><circle class="pulse" cx="646" cy="239.0" r="4" fill="#B7A4F2" style="animation-delay:1.2000000000000002s"/><text x="664" y="244.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">4 languages <tspan fill="#9A93B4" font-weight="400">Tamil · English · Hindi · 日本語</tspan></text><circle class="pulse" cx="646" cy="277.0" r="4" fill="#B7A4F2" style="animation-delay:1.6s"/><text x="664" y="282.0" class="sans" font-size="15" fill="#E8E6F0" font-weight="600">Design Lead by night <tspan fill="#9A93B4" font-weight="400">posters, creatives and this README</tspan></text>
