<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="now-t now-d">
<title id="now-t">Right now and quick facts</title>
<desc id="now-d">Right now: RootLens AI-assisted root-cause analysis for microservices; TriageIQ real-time LLM ticket triage with Kafka and RAG; Binary search trees in Java and solving LeetCode daily; Pit Wall an F1 race replay built on real GPS data. Quick facts: Co-inventor on a smart walker patent (filing in progress); Singapore NUS Industry 4.0 and SuperAI 2025; 31 dental conditions detected on 13,000+ X-rays; 4 languages Tamil · English · Hindi · 日本語; Design Lead by night posters, creatives and this README</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#B7A4F2}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="now-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#1C1630"/>
    <stop offset=".55" stop-color="#14101F"/>
    <stop offset="1" stop-color="#0B0912"/>
  </radialGradient>
  <radialGradient id="now-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7B61D9" stop-opacity=".45"/>
    <stop offset="1" stop-color="#7B61D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="now-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E8E6F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E8E6F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="now-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C9C5D8"/>
    <stop offset="1" stop-color="#B7A4F2"/>
  </linearGradient>
  <linearGradient id="now-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B7A4F2" stop-opacity="0"/>
    <stop offset=".25" stop-color="#B7A4F2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#B7A4F2" stop-opacity="0"/>
  </linearGradient>
  <pattern id="now-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#B7A4F2" stroke-opacity=".05"/>
  </pattern>
  <filter id="now-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#now-bg)" stroke="#2D2647"/>
