<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-labelledby="t09-t t09-d">
<title id="t09-t">09 Commit Log: A year of building.</title>
<desc id="t09-d">CONTRIBUTIONS</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#B7A4F2}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="t09-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#1C1630"/>
    <stop offset=".55" stop-color="#14101F"/>
    <stop offset="1" stop-color="#0B0912"/>
  </radialGradient>
  <radialGradient id="t09-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7B61D9" stop-opacity=".45"/>
    <stop offset="1" stop-color="#7B61D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="t09-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E8E6F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E8E6F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="t09-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C9C5D8"/>
    <stop offset="1" stop-color="#B7A4F2"/>
  </linearGradient>
  <linearGradient id="t09-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B7A4F2" stop-opacity="0"/>
    <stop offset=".25" stop-color="#B7A4F2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#B7A4F2" stop-opacity="0"/>
  </linearGradient>
  <pattern id="t09-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#B7A4F2" stroke-opacity=".05"/>
  </pattern>
  <filter id="t09-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<text x="30" y="32" class="mono" font-size="12" fill="#E8E6F0" text-anchor="start" letter-spacing="3">09</text>
<text x="58" y="32" class="mono" font-size="12" fill="#B7A4F2" text-anchor="start" letter-spacing="3">COMMIT LOG</text>
<text x="1170" y="32" class="mono" font-size="11" fill="#9A93B4" text-anchor="end" letter-spacing="3">CONTRIBUTIONS</text>
<text x="30" y="80" class="serif" font-size="40" fill="#E8E6F0">A year of <tspan fill="#B7A4F2" font-style="italic">building.</tspan></text>
<rect x="30" y="96" width="1140" height="1.2" fill="url(#t09-rule)"/>
<circle cy="96.6" r="2.6" fill="#fff">
  <animate attributeName="cx" values="30;1170" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="6s" repeatCount="indefinite"/>
</circle>

</svg>
