<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="yt-t yt-d">
<title id="yt-t">YouTube channel @shreejith-l7o</title>
<desc id="yt-d">My YouTube channel @shreejith-l7o: Come watch me build. Project demos, behind-the-scenes builds and everything in between. Click to subscribe.</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#839DFB}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="yt-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#161C30"/>
    <stop offset=".55" stop-color="#10131F"/>
    <stop offset="1" stop-color="#090B12"/>
  </radialGradient>
  <radialGradient id="yt-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#416AE6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#416AE6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="yt-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6E9F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E6E9F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="yt-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C5CAD8"/>
    <stop offset="1" stop-color="#839DFB"/>
  </linearGradient>
  <linearGradient id="yt-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#839DFB" stop-opacity="0"/>
    <stop offset=".25" stop-color="#839DFB" stop-opacity=".8"/>
    <stop offset="1" stop-color="#839DFB" stop-opacity="0"/>
  </linearGradient>
  <pattern id="yt-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#839DFB" stroke-opacity=".05"/>
  </pattern>
  <filter id="yt-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#yt-bg)" stroke="#262E47"/>
<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#yt-grid)"/>
<ellipse cx="900" cy="132" rx="420" ry="231" fill="url(#yt-glowA)"/>
<ellipse cx="300" cy="198" rx="300" ry="165" fill="url(#yt-glowB)"/><radialGradient id="yt-red" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF0033" stop-opacity=".35"/><stop offset="1" stop-color="#FF0033" stop-opacity="0"/></radialGradient><ellipse cx="860" cy="165" rx="360" ry="200" fill="url(#yt-red)"/><g transform="translate(40 40)"><rect width="68" height="48" rx="14" fill="#FF0033"/><path d="M27 14L45 24L27 34Z" fill="#fff"/></g><text x="124" y="60" class="mono" font-size="11" fill="#FF8FA3" text-anchor="start" letter-spacing="3">YOUTUBE CHANNEL</text><text x="124" y="84" class="mono" font-size="16" fill="#C5CAD8" text-anchor="start" >@shreejith-l7o</text><text x="38" y="152" class="serif" font-size="44" fill="url(#yt-silver)" text-anchor="start" >Come watch me build.</text><text x="40" y="186" class="sans" font-size="15" fill="#939BB4" text-anchor="start" >Project demos, behind-the-scenes builds and everything in between.</text><g transform="translate(40 216)"><rect width="190" height="50" rx="25" fill="#FF0033"><animate attributeName="opacity" values="1;.82;1" dur="2s" repeatCount="indefinite"/></rect><text x="78" y="31" class="sans" font-size="16" font-weight="700" fill="#fff" letter-spacing="1.5">SUBSCRIBE</text><g transform="translate(40 25)"><g><path d="M-9 6V-1a9 9 0 0 1 18 0V6l3 3H-12Z M-3 11a3 3 0 0 0 6 0" fill="#fff"/><animateTransform attributeName="transform" type="rotate" values="0;18;-18;12;-12;0;0" keyTimes="0;.06;.12;.18;.24;.3;1" dur="3s" repeatCount="indefinite"/></g></g></g><text x="250" y="248" class="mono" font-size="12" fill="#646E89" text-anchor="start" >▸ click anywhere on this card</text><rect x="640" y="34" width="520" height="262" rx="16" fill="#090B12" stroke="#2B3963"/><rect x="640" y="34" width="520" height="262" rx="16" fill="url(#yt-grid)"/><rect x="680" y="184" width="56" height="40" rx="6" fill="#839DFB" fill-opacity=".18"><animate attributeName="height" values="40;70;40" dur="2.0s" repeatCount="indefinite"/><anima