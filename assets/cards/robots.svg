<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="robots-t"><title id="robots-t">Two cute robots: Byte, white with glowing eyes, floats and waves; Mochi, white and pink with wings, flaps and sends hearts.</title>
