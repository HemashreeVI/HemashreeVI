  </filter>
  <linearGradient id="pt0-sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5E6A92"/>
    <stop offset=".45" stop-color="#3B5BDB"/>
    <stop offset=".5" stop-color="#FFFFFF"/>
    <stop offset=".55" stop-color="#3B5BDB"/>
    <stop offset="1" stop-color="#5E6A92"/>
    <animate attributeName="x1" values="-1;1.2" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2.2" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="pt0-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

