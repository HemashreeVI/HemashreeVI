    <stop offset="1" stop-color="#3047C9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pt0-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#1B2559" stop-opacity=".12"/>
    <stop offset="1" stop-color="#1B2559" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pt0-silver" x1="0" y1="0" x2="1" y2="0">
