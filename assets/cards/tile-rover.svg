<title id="pt6-t">Hazard-Detection Rover</title>
<desc id="pt6-d">Hazard-Detection Rover: A rover that explores a disaster zone and flags hazards for rescuers. Q-learning learns to explore; CNN hazard perception; Patent co-inventor. Tech: Python, PyTorch, Q-Learning, CNN, Node-RED, MQTT</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
