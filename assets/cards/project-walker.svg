<text x="40" y="154" class="mono" font-size="12" fill="#9A93B4" text-anchor="start" >BUILT › Dual IMUs + load cells · sensor fusion · fall-risk prediction · standalone on</text><text x="40" y="172" class="mono" font-size="12" fill="#9A93B4" text-anchor="start" >         Arduino</text>
