<!doctype html>
<!--
  The README's "phone": a home screen drawn in HTML, screenshotted by
  render_phone.js and cut into slices (top, one PNG per app icon, dock,
  bottom). In the README each slice is wrapped in its own link, so every
  app on the phone is clickable.
-->
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:Inter,system-ui,sans-serif}
#phone{position:relative;width:380px;border-radius:52px;background:#0A0A10;padding:13px;
  box-shadow:inset 0 0 0 2px #2A2A38, inset 0 0 0 4px #111}
#screen{position:relative;border-radius:40px;overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% 105%, #FF2E88 0%, rgba(255,46,136,0) 55%),
    radial-gradient(80% 50% at 15% 20%, rgba(34,211,238,.35), rgba(34,211,238,0) 70%),
    linear-gradient(180deg,#0B0420 0%,#1D0B45 45%,#4A1259 78%,#7A1D5E 100%);}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:1px}
#skyline{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:0}
.stars{position:absolute;inset:0;z-index:0}
#screen>div:not(.stars){position:relative;z-index:1}
.status{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;font:600 15px Inter}
.punch{position:absolute;left:50%;top:12px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #1a1a24}
.sicons{display:flex;gap:6px;align-items:center}
.widget{margin:10px 18px 0;padding:16px;border-radius:26px;background:rgba(12,6,30,.55);border:1px solid rgba(255,255,255,.12);color:#fff;display:flex;gap:14px;align-items:center;backdrop-filter:blur(2px)}
.widget img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #F472B6}
.widget h1{font:800 21px Inter;letter-spacing:.5px}
.widget p{font:500 12.5px Inter;color:#D9D6F5;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font:700 11px 'JetBrains Mono',monospace;letter-spacing:1px;color:#5EEAD4;background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.4);padding:3px 9px;border-radius:20px}
.pill b{width:7px;height:7px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 8px #5EEAD4}
.clock{text-align:center;color:#fff;margin-top:18px}
.clock .t{font:200 64px Inter;letter-spacing:-1px;line-height:1;text-shadow:0 0 24px rgba(244,114,182,.6)}
.clock .d{font:600 13px Inter;color:#EDE9FE;margin-top:4px;letter-spacing:.5px}
.notif{margin:18px 14px 0;padding:11px 13px;border-radius:20px;background:rgba(250,250,255,.92);display:flex;gap:11px;align-items:center;color:#14111F}
.notif .ic{width:36px;height:36px;border-radius:10px;flex:none}
.notif .ttl{font:700 12.5px Inter;display:flex;justify-content:space-between}
.notif .ttl span{font-weight:500;color:#6B6880}
.notif .msg{font:500 12.5px Inter;color:#2C2940;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,88px);justify-content:center;row-gap:0;margin-top:14px}
.app{height:108px;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.app .ic{width:60px;height:60px;border-radius:17px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.app .ic svg,.app .ic img{width:60px;height:60px;display:block}
.app span{margin-top:7px;font:600 12px Inter;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap}
.dots{display:flex;gap:7px;justify-content:center;padding:10px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.dock{margin:0 12px;height:96px;border-radius:30px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center}
.dock .app{height:96px;padding-top:18px}
.homebar{height:34px;display:flex;align-items:center;justify-content:center}
.homebar i{width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
</style></head><body>
<div id="phone"><div id="screen">
  <div class="stars" id="stars"></div>
  <svg id="skyline" viewBox="0 0 354 300" preserveAspectRatio="none"></svg>

  <div data-slice="top">
    <div class="status"><span>9:41</span><div class="punch"></div>
      <div class="sicons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5L1 4.2a10 10 0 0 1 14 0Z" fill="#fff"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="#5EEAD4"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#fff"/></svg>
      </div></div>
    <div class="clock"><div class="t">9:41</div><div class="d">You're on Hemashree's phone 📱</div></div>
    <div class="widget"><img src="../../assets/photo.jpg">
      <div><h1>HEMASHREE</h1><p>Software Engineer · VIT '27</p><div class="pill"><b></b>OPEN TO WORK</div></div></div>
    <div class="notif">
      <svg class="ic" viewBox="0 0 36 36"><defs><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><rect width="36" height="36" rx="10" fill="url(#n)"/><path d="M9 11h18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4h-4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z" fill="#fff"/></svg>
      <div style="flex:1"><div class="ttl">Hemashree<span>now</span></div><div class="msg">hey, welcome in! tap any app to open it 👇</div></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div data-slice="dots" class="dots"><i></i><i class="on"></i><i></i></div>
  <div data-slice="dock" class="dock" id="dock"></div>
  <div data-slice="bottom" class="homebar"><i></i></div>
</div></div>
<script>
const I = n => `<img src="../../assets/icons/social-${n}.svg">`;
const T = (bg, glyph, fg) => `<svg viewBox="0 0 60 60"><defs>${bg[0]}</defs><rect width="60" height="60" fill="${bg[1]}"/>${glyph}</svg>`;
const grad = (id, a, b) => [`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`, `url(#${id})`];
const W = 'fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"';
window.APPS = [
  ['seatlock', 'SeatLock', T(grad('a1', '#F472B6', '#BE185D'),
    `<path d="M16 32V22a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v10" ${W}/><path d="M12 32h36v6H12z" ${W}/><path d="M18 38v5M42 38v5" ${W}/><rect x="25" y="23" width="10" height="8" rx="2" fill="#fff"/><path d="M27 23v-2.5a3 3 0 0 1 6 0V23" ${W} stroke-width="2.4"/>`)],
  ['rootlens', 'RootLens', T(grad('a2', '#22D3EE', '#0E7490'),
    `<path d="M12 40l8-9 6 5 9-12" ${W}/><circle cx="37" cy="27" r="9" ${W}/><path d="M44 34l6 6" ${W}/>`)],
  ['triageiq', 'TriageIQ', T(grad('a3', '#FCD34D', '#D97706'),
    `<path d="M12 30l6-12h24l6 12v10a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3Z" ${W}/><path d="M12 30h10l3 5h10l3-5h10" ${W}/><path d="M30 9l1.5 3.5L35 14l-3.5 1.5L30 19l-1.5-3.5L25 14l3.5-1.5Z" fill="#fff"/>`)],
  ['gitloom', 'GitLoom', T(grad('a4', '#A78BFA', '#6D28D9'),
    `<path d="M14 18c8 0 8 8 16 8s8-8 16-8M14 30c8 0 8 8 16 8s8-8 16-8M14 42c8 0 8-8 16-8" ${W} stroke-width="3"/><path d="M14 14v32M46 14v32" ${W}/>`)],
  ['walker', 'Walker 📜', T(grad('a5', '#34D399', '#047857'),
    `<path d="M20 46V18a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v28" ${W}/><path d="M20 30h20" ${W}/><circle cx="20" cy="47" r="2.5" fill="#fff"/><circle cx="40" cy="47" r="2.5" fill="#fff"/><path d="M47 14a8 8 0 0 1 0 10M50 11a12 12 0 0 1 0 16" ${W} stroke-width="2.4"/>`)],
  ['rover', 'Rover 📜', T(grad('a6', '#FB923C', '#C2410C'),
    `<rect x="14" y="26" width="32" height="11" rx="3" ${W}/><circle cx="19" cy="42" r="4" ${W}/><circle cx="30" cy="42" r="4" ${W}/><circle cx="41" cy="42" r="4" ${W}/><path d="M30 26v-8M30 18h7" ${W}/><circle cx="39" cy="18" r="2.6" fill="#fff"/>`)],
  ['dental', 'Dental AI', T(grad('a7', '#E0F2FE', '#7DD3FC'),
    `<path d="M22 14c-6 0-9 5-8 11 1 5 3 7 4 13 1 4 3 8 5 8 3 0 3-8 7-8s4 8 7 8c2 0 4-4 5-8 1-6 3-8 4-13 1-6-2-11-8-11-4 0-5 2-8 2s-4-2-8-2Z" fill="#fff" stroke="#0369A1" stroke-width="2.6" stroke-linejoin="round"/><path d="M14 30h32" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3"/>`)],
  ['bytedecoded', 'Byte Decoded', T(['<linearGradient id="a8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1F27"/><stop offset="1" stop-color="#0B0B10"/></linearGradient>', 'url(#a8)'],
    `<rect x="11" y="17" width="38" height="26" rx="8" fill="#FF0033"/><path d="M26 23.5l10 6.5-10 6.5Z" fill="#fff"/><text x="30" y="54" font-family="JetBrains Mono" font-size="7.5" font-weight="700" fill="#FF6680" text-anchor="middle">&lt;/&gt; BYTE</text>`)],
  ['leetcode', 'LeetCode', I('leetcode')],
  ['chesscom', 'Chess', I('chesscom')],
  ['portfolio', 'Portfolio', I('portfolio')],
  ['games', 'Games', T(grad('a9', '#F43F5E', '#7C3AED'),
    `<path d="M18 22h24a8 8 0 0 1 8 8v4a7 7 0 0 1-12 5l-3-3H25l-3 3a7 7 0 0 1-12-5v-4a8 8 0 0 1 8-8Z" fill="#fff"/><path d="M20 28v8M16 32h8" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="29" r="2.4" fill="#F43F5E"/><circle cx="43" cy="34" r="2.4" fill="#22D3EE"/>`)],
];
window.DOCK = [['gmail', 'Gmail', I('gmail')], ['linkedin', 'LinkedIn', I('linkedin')], ['instagram', 'Instagram', I('instagram')],
  ['github', 'GitHub', T(['<linearGradient id="a0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D333B"/><stop offset="1" stop-color="#0D1117"/></linearGradient>', 'url(#a0)'],
    `<path fill="#fff" transform="translate(12 12) scale(1.5)" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>`)]];
const appHtml = ([id, name, ic]) => `<div class="app" data-app="${id}"><div class="ic">${ic}</div><span>${name}</span></div>`;
document.getElementById('grid').innerHTML = APPS.map(appHtml).join('');
document.getElementById('dock').innerHTML = DOCK.map(appHtml).join('').replaceAll('<span>', '<span style="display:none">');
// stars + skyline
let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
document.getElementById('stars').innerHTML = Array.from({length: 70}, () => `<i style="left:${r()*354}px;top:${r()*420}px;opacity:${.2+r()*.7}"></i>`).join('');
let sk = '', x = 0;
while (x < 354) { const w = 18 + r() * 30, h = 70 + r() * 150; sk += `<rect x="${x}" y="${300-h}" width="${w}" height="${h}" fill="#140827" opacity=".85"/>`;
  for (let wy = 300 - h + 8; wy < 290; wy += 12) for (let wx = x + 4; wx < x + w - 5; wx += 8) if (r() < .22) sk += `<rect x="${wx}" y="${wy}" width="3" height="5" fill="${['#FDE68A','#67E8F9','#F9A8D4'][Math.floor(r()*3)]}" opacity=".7"/>`;
  x += w + 1; }
document.getElementById('skyline').innerHTML = sk;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; }))));
</script>
</body></html>
