<!doctype html>
<!--
  Cinematic intro for the profile README, drawn on a canvas one frame at a time.
  scripts/intro/render_intro.js loads this page, calls window.renderFrame(t)
  for every frame and turns the frames into assets/intro/hemashree-intro.{mp4,gif}.

  0.0–2.9s  terminal boot screen
  2.9–3.3s  glitch cut
  3.3s on   neon city at night: title glitches in, cats show up on the street
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05030B}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="800"></canvas>
<script>
const W = 1920, H = 800, DURATION = 15;
const ROYAL = '#8B5CF6', SKY = '#22D3EE', ICE = '#E0E7FF', SILVER = '#F1F5FF', MUTED = '#A5A3C9', PINK = '#F472B6', GOLD = '#FCD34D';
const KICKER = 'POV:';
const NAME = 'YOU’RE ON MY GITHUB';
const ROLE = 'HEMASHREE · SOFTWARE ENGINEER';
const TAGLINE = 'stay a while, it’s a vibe ✨';
const TAGS = ['COMPUTER VISION', 'SECURITY', 'BACKEND & DEVOPS', 'EMBEDDED & IoT'];
const HUD_L = 'VIT CHENNAI · B.TECH CSE';
const HUD_R = 'OPEN TO WORK';
const BOOT = [
  ['> booting hemashree.exe', '', 'OK'],
  ['> loading projects', 'SeatLock · RootLens · TriageIQ', 'OK'],
  ['> mounting patents', 'smart-walker · hazard-rover', 'OK'],
  ['> linking channel', 'Byte Decoded ▶', 'OK'],
  ['> status', 'OPEN TO WORK', ''],
];
const BOOT_END = 2.9, CITY = 3.0;

const cv = document.getElementById('c'), g = cv.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tg = tmp.getContext('2d');

// ---------- helpers
let seed = 20261113;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const NAME_FONT = '800 124px Inter';
const NAME_Y = 290;
const HORIZON = 640;

// ---------- city, generated once
const sky = document.createElement('canvas'); sky.width = W; sky.height = H;
const NEON = ['#22D3EE', '#F472B6', '#FCD34D', '#A78BFA'];
const winColors = ['#FDE68A', '#67E8F9', '#F9A8D4', '#C4B5FD'];
const flicker = [];   // windows that switch on and off
const beacons = [];   // red blinking lights on rooftops
const signs = [];     // neon signs

function building(c, x, w, top, fill, edge, winA) {
  c.fillStyle = fill; c.fillRect(x, top, w, HORIZON - top);
  c.fillStyle = edge; c.fillRect(x, top, w, 2);
  // windows
  for (let y = top + 14; y < HORIZON - 12; y += 18)
    for (let wx = x + 8; wx < x + w - 10; wx += 14) {
      const r = rnd();
      if (r < .26) {
        const col = winColors[Math.floor(rnd() * winColors.length)];
        if (r < .03) flicker.push({ x: wx, y, col, p: rnd() * 100, a: winA });
        else { c.globalAlpha = winA * (.45 + rnd() * .55); c.fillStyle = col; c.fillRect(wx, y, 6, 8); c.globalAlpha = 1; }
      }
    }
}

function buildCity() {
  const c = sky.getContext('2d');
  // sky: deep night fading to magenta at the horizon
  const sg = c.createLinearGradient(0, 0, 0, HORIZON);
  sg.addColorStop(0, '#05030B'); sg.addColorStop(.5, '#170A35'); sg.addColorStop(.85, '#4A1259'); sg.addColorStop(1, '#7A1D5E');
  c.fillStyle = sg; c.fillRect(0, 0, W, HORIZON);
  // stars
  for (let i = 0; i < 160; i++) {
    c.globalAlpha = .2 + rnd() * .7; c.fillStyle = '#fff';
    c.fillRect(rnd() * W, rnd() * 380, rnd() < .1 ? 2 : 1, rnd() < .1 ? 2 : 1);
  }
  c.globalAlpha = 1;
  // crisp striped moon
  const mx = W / 2, my = 470, mr = 150;
  c.save(); c.beginPath(); c.arc(mx, my, mr, 0, 6.28); c.clip();
  const mg = c.createLinearGradient(0, my - mr, 0, my + mr);
  mg.addColorStop(0, '#FCD34D'); mg.addColorStop(.5, '#F472B6'); mg.addColorStop(1, '#8B5CF6');
  c.fillStyle = mg; c.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  c.fillStyle = '#2A0F45';
  for (let i = 0; i < 8; i++) { const y = my - 10 + i * 18; c.fillRect(mx - mr, y, mr * 2, 3 + i * 1.6); }
  c.restore();
  // back skyline: lower in the middle so the title has room
  for (let x = -20; x < W + 20;) {
    const w = 46 + rnd() * 70, e = Math.abs(x + w / 2 - W / 2) / (W / 2);
    const top = HORIZON - (110 + 230 * Math.pow(e, 1.2) + rnd() * 70);
    building(c, x, w, top, '#1C1038', '#3B2470', .55);
    if (rnd() < .25) { c.fillStyle = '#1C1038'; c.fillRect(x + w / 2 - 1, top - 30, 2, 30); beacons.push({ x: x + w / 2, y: top - 32, p: rnd() * 6 }); }
    x += w + 2;
  }
  // front skyline, darker, with hero towers at the edges for the neon signs
  const front = [
    [-10, 120, 230], [110, 70, 470], [180, 140, 330], [320, 90, 520], [410, 120, 410], [530, 80, 545],
    [610, 110, 575], [720, 90, 560], [1110, 90, 560], [1200, 110, 575], [1310, 80, 545], [1390, 120, 420],
    [1510, 90, 510], [1600, 150, 300], [1750, 70, 460], [1820, 110, 250],
  ];
  for (const [x, w, top] of front) building(c, x, w, top, '#0C0719', '#2A1850', .9);
  signs.push({ x: 40, y: 270, text: 'SEATLOCK', col: NEON[1], v: true, p: 1 });
  signs.push({ x: 228, y: 350, text: 'ROOTLENS', col: NEON[0], v: true, p: 2.3 });
  signs.push({ x: 1648, y: 320, text: 'TRIAGEIQ', col: NEON[2], v: true, p: 3.1 });
  signs.push({ x: 1850, y: 275, text: 'バイト', col: NEON[3], v: true, p: .4 });
  signs.push({ x: 1395, y: 445, text: 'BYTE DECODED', col: NEON[1], v: false, p: 5.2 });
  signs.push({ x: 415, y: 432, text: 'OPEN 24/7', col: NEON[0], v: false, p: 6.7 });
}

const cars = Array.from({ length: 6 }, (_, i) => ({
  y: 150 + i * 52 + rnd() * 20, sp: 260 + rnd() * 260, dir: i % 2 ? -1 : 1, off: rnd() * 3000, s: .7 + (i / 6) * .5,
}));
const rain = Array.from({ length: 110 }, () => ({ x: rnd() * W, y: rnd() * H, sp: 1100 + rnd() * 500, l: 14 + rnd() * 16 }));

function signOn(s, t) {
  // mostly on, with the odd buzz-flicker
  const k = Math.floor(t * 12 + s.p * 7);
  return !(hash(k + s.p) > .975 || (hash(Math.floor(t * .7 + s.p)) > .86 && hash(k * 3.1) > .5));
}

function drawSign(s, t, a) {
  const on = signOn(s, t);
  g.save(); g.globalAlpha = a;
  g.font = s.v ? '800 30px "JetBrains Mono"' : '800 26px "JetBrains Mono"';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '0px';
  const chars = [...s.text];
  let bw, bh;
  if (s.v) { bw = 52; bh = chars.length * 34 + 22; } else { bw = g.measureText(s.text).width + 40; bh = 50; }
  g.fillStyle = 'rgba(8,4,18,.9)'; g.strokeStyle = on ? s.col : '#3A2A55'; g.lineWidth = 3;
  if (on) { g.shadowColor = s.col; g.shadowBlur = 22; }
  g.beginPath(); g.roundRect(s.x - bw / 2, s.y, bw, bh, 8); g.fill(); g.stroke();
  g.fillStyle = on ? '#fff' : '#4B3B66';
  if (on) { g.shadowColor = s.col; g.shadowBlur = 16; }
  if (s.v) chars.forEach((ch, i) => g.fillText(ch, s.x, s.y + 28 + i * 34));
  else g.fillText(s.text, s.x, s.y + bh / 2 + 1);
  g.restore();
  return on;
}

function street(t, a) {
  g.save(); g.globalAlpha = a;
  const fg = g.createLinearGradient(0, HORIZON, 0, H);
  fg.addColorStop(0, '#1A0A2E'); fg.addColorStop(1, '#05030B');
  g.fillStyle = fg; g.fillRect(0, HORIZON, W, H - HORIZON);
  // wet reflections of the signs: wobbling dashes
  for (const s of signs) {
    if (!signOn(s, t)) continue;
    g.fillStyle = s.col;
    for (let i = 0; i < 9; i++) {
      const y = HORIZON + 8 + i * 16, wob = Math.sin(t * 4 + i * 1.7 + s.p) * 6;
      g.globalAlpha = a * (.5 - i * .05);
      g.fillRect(s.x - 18 + wob - i * 2, y, 36 + i * 4, 3);
    }
  }
  g.globalAlpha = a;
  // moon reflection
  g.fillStyle = PINK;
  for (let i = 0; i < 7; i++) { const w = 220 - i * 26 + Math.sin(t * 3 + i) * 10; g.globalAlpha = a * (.35 - i * .04); g.fillRect(W / 2 - w / 2, HORIZON + 10 + i * 18, w, 3); }
  // perspective grid, crisp and dim
  g.beginPath(); g.rect(0, HORIZON, W, H - HORIZON); g.clip();
  g.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const z = (i + (t * .8) % 1) / 12, y = HORIZON + Math.pow(z, 2.2) * (H - HORIZON + 40);
    g.globalAlpha = a * (.08 + .35 * z); g.strokeStyle = '#A78BFA';
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  g.strokeStyle = '#22D3EE';
  for (let i = -20; i <= 20; i++) {
    g.globalAlpha = a * .22;
    g.beginPath(); g.moveTo(W / 2 + i * 8, HORIZON); g.lineTo(W / 2 + i * 260, H); g.stroke();
  }
  g.restore();
  // neon horizon line
  g.save(); g.globalAlpha = a;
  const hl = g.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, '#22D3EE'); hl.addColorStop(.5, '#FFFFFF'); hl.addColorStop(1, '#F472B6');
  g.fillStyle = hl; g.fillRect(0, HORIZON - 1, W, 2);
  g.restore();
}

function city(t) {
  const a = prog(t, CITY, CITY + .25);
  if (a <= 0) return;
  g.globalAlpha = a; g.drawImage(sky, 0, 0); g.globalAlpha = 1;
  // flickering windows and rooftop beacons
  for (const f of flicker) {
    if (hash(Math.floor(t * 2 + f.p)) > .45) { g.globalAlpha = a * f.a; g.fillStyle = f.col; g.fillRect(f.x, f.y, 6, 8); }
  }
  for (const b of beacons) {
    const on = Math.sin(t * 3 + b.p) > .3;
    g.globalAlpha = a * (on ? 1 : .25); g.fillStyle = '#FF3355'; g.fillRect(b.x - 2, b.y - 2, 4, 4);
  }
  g.globalAlpha = 1;
  // flying cars with light trails
  for (const c of cars) {
    const span = W + 400, x0 = ((c.off + t * c.sp) % span) - 200, x = c.dir > 0 ? x0 : W - x0;
    const len = 90 * c.s, dir = c.dir;
    const tr = g.createLinearGradient(x, 0, x - dir * len * 2.2, 0);
    tr.addColorStop(0, 'rgba(255,60,90,.9)'); tr.addColorStop(1, 'rgba(255,60,90,0)');
    g.globalAlpha = a; g.fillStyle = tr; g.fillRect(Math.min(x, x - dir * len * 2.2), c.y + 2, len * 2.2, 3 * c.s);
    g.fillStyle = '#0B0717'; g.strokeStyle = '#6D5BA8'; g.lineWidth = 1.5;
    g.beginPath(); g.roundRect(x - 16 * c.s, c.y - 6 * c.s, 32 * c.s, 12 * c.s, 5 * c.s); g.fill(); g.stroke();
    g.fillStyle = '#E0F2FE'; g.fillRect(x + dir * 15 * c.s - 2, c.y - 2, 4, 4);
    g.fillStyle = '#FF3355'; g.fillRect(x - dir * 15 * c.s - 2, c.y - 2, 4, 4);
  }
  g.globalAlpha = 1;
  for (const s of signs) drawSign(s, t, a);
  street(t, a);
}

function rainFx(t) {
  const a = prog(t, CITY, CITY + .4) * (1 - prog(t, 14.3, 15));
  if (a <= 0) return;
  g.save(); g.strokeStyle = 'rgba(190,210,255,.28)'; g.lineWidth = 1.5; g.globalAlpha = a;
  g.beginPath();
  for (const r of rain) {
    const y = (r.y + t * r.sp) % (H + 40) - 40, x = (r.x - (t * r.sp) * .18) % W;
    const xx = x < 0 ? x + W : x;
    g.moveTo(xx, y); g.lineTo(xx - r.l * .18, y + r.l);
  }
  g.stroke(); g.restore();
}

// ---------- boot screen
function boot(t) {
  if (t > BOOT_END + .45) return;
  g.fillStyle = '#05030B'; g.fillRect(0, 0, W, H);
  g.save();
  g.font = '500 34px "JetBrains Mono"'; g.letterSpacing = '0px'; g.textBaseline = 'middle'; g.textAlign = 'left';
  const x = 220, y0 = 210, lh = 66, per = .44;
  BOOT.forEach(([cmd, arg, ok], i) => {
    const k = prog(t, .2 + i * per, .2 + i * per + per * .7);
    if (k <= 0) return;
    const full = cmd + (arg ? '  ' + arg : ''), n = Math.ceil(full.length * k), shown = full.slice(0, n);
    const y = y0 + i * lh;
    g.fillStyle = '#5EEAD4'; g.shadowColor = '#22D3EE'; g.shadowBlur = 10;
    g.fillText(shown.slice(0, cmd.length), x, y);
    if (shown.length > cmd.length) {
      g.fillStyle = i === BOOT.length - 1 ? PINK : ICE;
      g.fillText(shown.slice(cmd.length), x + g.measureText(cmd).width, y);
    }
    if (k >= 1 && ok) { g.fillStyle = '#86EFAC'; g.shadowColor = '#22C55E'; g.fillText('[ ' + ok + ' ]', 1500, y); }
    if (k < 1 || (i === BOOT.length - 1 && Math.floor(t * 4) % 2 === 0)) {
      g.shadowBlur = 0; g.fillStyle = '#5EEAD4'; g.fillRect(x + g.measureText(shown).width + 6, y - 18, 16, 36);
    }
  });
  // progress bar
  const pk = prog(t, .2, BOOT_END - .15);
  g.shadowBlur = 0;
  g.strokeStyle = '#2A1850'; g.lineWidth = 2; g.strokeRect(x, 600, 1480, 22);
  const bar = g.createLinearGradient(x, 0, x + 1480, 0);
  bar.addColorStop(0, SKY); bar.addColorStop(.5, ROYAL); bar.addColorStop(1, PINK);
  g.fillStyle = bar; g.fillRect(x + 4, 604, 1472 * pk, 14);
  g.font = '500 22px "JetBrains Mono"'; g.fillStyle = MUTED;
  g.fillText(`loading profile ${Math.round(pk * 100)}%`, x, 660);
  // scanlines
  g.fillStyle = 'rgba(0,0,0,.25)';
  for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2);
  g.restore();
}

// ---------- glitch: displace horizontal slices of whatever is on screen, add RGB bars
function glitch(t, strength, s0) {
  if (strength <= 0) return;
  tg.clearRect(0, 0, W, H); tg.drawImage(cv, 0, 0);
  const step = Math.floor(t * 30);
  let y = 0, i = 0;
  while (y < H) {
    const h = 8 + hash(step * 13 + i + s0) * 70;
    const r = hash(step * 7 + i * 3 + s0);
    if (r < .55 * strength) {
      const dx = (hash(step + i * 11 + s0) - .5) * 260 * strength;
      g.drawImage(tmp, 0, y, W, h, dx, y, W, h);
      if (r < .18 * strength) {
        g.globalCompositeOperation = 'lighter'; g.globalAlpha = .35;
        g.fillStyle = r < .09 * strength ? '#FF0055' : '#00E5FF';
        g.fillRect(0, y, W, Math.max(2, h * .3));
        g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      }
    }
    y += h; i++;
  }
}

// ---------- title
function titleGlitchAmt(t) {
  // strong while it appears, then short bursts now and then
  let k = 1 - prog(t, 3.5, 4.3);
  if (t < 3.5) k = 0;
  for (const b of [6.3, 9.6, 12.9]) if (t > b && t < b + .2) k = Math.max(k, .7);
  return k;
}

function drawName(x, y, fill, alpha) {
  g.globalAlpha = alpha; g.fillStyle = fill; g.fillText(NAME, x, y);
}

function nameSolid(t) {
  const a = t < 3.5 ? 0 : (t < 4.3 ? (hash(Math.floor(t * 30)) > .3 ? 1 : .2) : 1);
  if (a <= 0) return;
  const x = W / 2, gk = titleGlitchAmt(t);
  g.save();
  g.font = NAME_FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '6px';
  // dark backing so the title reads over the city
  const bk = g.createRadialGradient(x, NAME_Y, 80, x, NAME_Y, 900);
  bk.addColorStop(0, 'rgba(5,3,11,.55)'); bk.addColorStop(1, 'rgba(5,3,11,0)');
  g.globalAlpha = a; g.fillStyle = bk; g.fillRect(0, NAME_Y - 200, W, 420);
  if (gk > 0) {
    // RGB split
    const off = 10 + 22 * gk * hash(Math.floor(t * 30));
    g.globalCompositeOperation = 'lighter';
    drawName(x - off, NAME_Y, '#FF0055', .8 * a);
    drawName(x + off, NAME_Y + 3, '#00E5FF', .8 * a);
    g.globalCompositeOperation = 'source-over';
  }
  const nw = g.measureText(NAME).width, sh = Math.sin(t * .8) * 120;
  const fill = g.createLinearGradient(x - nw / 2 + sh, 0, x + nw / 2 + sh, 0);
  fill.addColorStop(0, '#67E8F9'); fill.addColorStop(.35, '#A78BFA'); fill.addColorStop(.7, '#F472B6'); fill.addColorStop(1, GOLD);
  g.shadowBlur = 30; g.shadowColor = '#7C3AED';
  drawName(x, NAME_Y, fill, a);
  g.shadowBlur = 0;
  drawName(x, NAME_Y, fill, a);
  g.restore();
  // chrome shine sweeping across, clipped to the letters
  shine(t, 4.6, 5.4, x);
  shine(t, 11.8, 12.6, x);
}

function shine(t, a, b, cx) {
  const k = prog(t, a, b);
  if (k <= 0 || k >= 1) return;
  tg.clearRect(0, 0, W, H);
  tg.save();
  tg.font = NAME_FONT; tg.textAlign = 'center'; tg.textBaseline = 'middle'; tg.letterSpacing = '6px';
  tg.fillStyle = '#fff'; tg.fillText(NAME, cx, NAME_Y);
  tg.globalCompositeOperation = 'source-in';
  const sx = cx - 900 + 1800 * easeInOut(k);
  const gr = tg.createLinearGradient(sx - 90, 0, sx + 90, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  tg.fillStyle = gr; tg.fillRect(0, 0, W, H);
  tg.restore();
  g.drawImage(tmp, 0, 0);
}

function kicker(t) {
  const k = prog(t, 3.3, 3.7);
  if (k <= 0) return;
  g.save();
  g.font = '700 54px "JetBrains Mono"'; g.letterSpacing = '6px'; g.textAlign = 'left'; g.textBaseline = 'middle';
  const full = g.measureText(KICKER).width, x0 = W / 2 - full / 2;
  const n = Math.ceil(KICKER.length * k);
  g.fillStyle = SKY; g.shadowColor = SKY; g.shadowBlur = 16;
  g.fillText(KICKER.slice(0, n), x0, NAME_Y - 118);
  g.restore();
}

function details(t) {
  const cx = W / 2;
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  const lk = easeInOut(prog(t, 4.6, 5.5));
  if (lk > 0) {
    const half = 640 * lk;
    const gr = g.createLinearGradient(cx - half, 0, cx + half, 0);
    gr.addColorStop(0, 'rgba(34,211,238,0)'); gr.addColorStop(.5, 'rgba(244,114,182,1)'); gr.addColorStop(1, 'rgba(34,211,238,0)');
    g.fillStyle = gr; g.fillRect(cx - half, 375, half * 2, 2);
  }
  const tk = prog(t, 5.0, 6.6);
  if (tk > 0) {
    g.font = 'italic 500 46px Inter'; g.letterSpacing = '0px'; g.textAlign = 'left';
    const full = g.measureText(TAGLINE).width, n = Math.floor(TAGLINE.length * tk), x0 = cx - full / 2;
    g.fillStyle = 'rgba(5,3,11,.55)'; g.beginPath(); g.roundRect(x0 - 26, 400, full + 52, 64, 32); g.fill();
    g.fillStyle = ICE; g.shadowColor = PINK; g.shadowBlur = 12;
    g.fillText(TAGLINE.slice(0, n), x0, 432);
    g.shadowBlur = 0;
    if (t < 9.2 && Math.floor(t * 2.5) % 2 === 0) {
      const w = g.measureText(TAGLINE.slice(0, n)).width;
      g.fillStyle = SKY; g.fillRect(x0 + w + 6, 409, 4, 46);
    }
  }
  const rk = prog(t, 6.8, 7.7);
  if (rk > 0) {
    g.font = '700 26px Inter'; g.letterSpacing = '10px'; g.textAlign = 'left';
    const n = Math.ceil(ROLE.length * rk), full = g.measureText(ROLE).width;
    g.fillStyle = 'rgba(5,3,11,.6)'; g.beginPath(); g.roundRect(cx - full / 2 - 20, 476, full + 40, 44, 22); g.fill();
    g.fillStyle = '#fff'; g.shadowColor = SKY; g.shadowBlur = 10;
    g.fillText(ROLE.slice(0, n), cx - full / 2 + 5, 498);
    g.shadowBlur = 0;
  }
  g.font = '600 22px "JetBrains Mono"'; g.letterSpacing = '2px'; g.textAlign = 'center';
  const widths = TAGS.map(s => g.measureText(s).width + 44), gap = 18;
  let x = cx - (widths.reduce((a, b) => a + b) + gap * (TAGS.length - 1)) / 2;
  TAGS.forEach((s, i) => {
    const k = backOut(prog(t, 7.8 + i * .22, 8.3 + i * .22));
    if (k > 0) {
      const w = widths[i], y = 580 + (1 - k) * 30;
      g.globalAlpha = clamp(k);
      g.fillStyle = 'rgba(8,4,18,.92)'; g.strokeStyle = [SKY, ROYAL, PINK, GOLD][i]; g.lineWidth = 2.5;
      g.beginPath(); g.roundRect(x, y - 24, w, 48, 24); g.fill(); g.stroke();
      g.fillStyle = SILVER; g.fillText(s, x + w / 2, y + 1);
    }
    x += widths[i] + gap;
  });
  g.globalAlpha = 1;
  const hk = prog(t, 3.4, 4.0);
  if (hk > 0) {
    g.globalAlpha = hk; g.font = '600 20px "JetBrains Mono"'; g.letterSpacing = '4px';
    g.textAlign = 'left'; g.fillStyle = ICE; g.fillText(HUD_L, 60, 52);
    g.textAlign = 'right'; g.fillStyle = '#5EEAD4'; g.fillText(HUD_R, W - 60, 52);
    g.beginPath(); g.arc(W - 60 - g.measureText(HUD_R).width - 22, 52, 7, 0, 6.28);
    g.globalAlpha = hk * (.5 + .5 * Math.sin(t * 5)); g.fill();
  }
  g.restore();
}

function vignette(t) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .6, W / 2, H / 2, W * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const out = prog(t, 14.3, 15);
  if (out > 0) { g.fillStyle = `rgba(5,3,11,${out})`; g.fillRect(0, 0, W, H); }
}

// ---------- two cats (poses from assets/cat, injected as window.CAT)
// Left cat walks in and says hello. Right cat plays with a ball, trips over
// it, and plays it cool. They trade a couple of lines.
const catImgs = {};
function loadCat() {
  const names = ['walk1', 'walk2', 'walk3', 'walk4', 'wave', 'sit'];
  return Promise.all(names.map(n => new Promise(res => {
    const src = (window.CAT || {})[n];
    if (!src) return res();
    const im = new Image(); im.onload = () => { catImgs[n] = im; res(); }; im.src = src;
  })));
}
const FEET = 770;
const pick = (n, h) => { const im = catImgs[n]; return [im, im.width * h / im.height]; };
const walkFrame = t => 'walk' + (1 + Math.floor(t / .13) % 4);

function shadowAt(x, w, a = .45) {
  g.fillStyle = `rgba(139,92,246,${a})`;
  g.beginPath(); g.ellipse(x, FEET, w * .36, 8, 0, 0, 6.28); g.fill();
}

// speech bubble anchored at (ax, ay), the tip of its tail; side: which way it grows
function bubble(t, t0, t1, text, ax, ay, side) {
  if (t < t0 || t > t1 + .25) return;
  const k = t < t1 ? backOut(prog(t, t0, t0 + .4)) : 1 - prog(t, t1, t1 + .25);
  if (k <= 0) return;
  g.save();
  g.font = '700 28px Inter'; g.letterSpacing = '0px';
  const bw = g.measureText(text).width + 56, bh = 58;
  const bx = side === 'right' ? ax + 26 : ax - 26 - bw, by = ay - bh / 2;
  g.translate(ax, ay); g.scale(k, k); g.translate(-ax, -ay);
  g.fillStyle = 'rgba(20,10,45,.95)'; g.strokeStyle = PINK; g.lineWidth = 3;
  g.beginPath(); g.roundRect(bx, by, bw, bh, 29); g.fill(); g.stroke();
  const ex = side === 'right' ? bx + 2 : bx + bw - 2, ex2 = side === 'right' ? bx : bx + bw;
  g.beginPath(); g.moveTo(ex, ay - 12); g.lineTo(ax, ay + 10); g.lineTo(ex, ay + 10); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(ex2, ay - 12); g.lineTo(ax, ay + 10); g.lineTo(ex2, ay + 10); g.stroke();
  g.fillStyle = SILVER; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, bx + bw / 2, by + bh / 2 + 1);
  g.restore();
}

// ---- left cat: walks in, waves, then reacts to the right cat
const L_IN = 8.4, L_STOP = 10.2, L_X = 170;
function leftCat(t) {
  if (t < L_IN || !catImgs.wave) return;
  g.save();
  if (t < L_STOP) {
    const x = -180 + (L_X + 180) * prog(t, L_IN, L_STOP);
    const [im, w] = pick(walkFrame(t), 160);
    shadowAt(x, w);
    g.drawImage(im, x - w / 2, FEET - 160, w, 160);
  } else {
    const [im, w] = pick('wave', 172);
    const land = prog(t, L_STOP, L_STOP + .25);
    const sq = land < 1 ? 1 - .06 * Math.sin(land * Math.PI) : 1;
    const sway = Math.sin((t - L_STOP) * 4) * .06 * prog(t, L_STOP + .2, L_STOP + .5);
    shadowAt(L_X, w);
    g.translate(L_X, FEET); g.rotate(sway); g.scale(2 - sq, sq);
    g.drawImage(im, -w / 2, -172, w, 172);
    g.setTransform(1, 0, 0, 1, 0, 0);
    const px = L_X - w * .28, py = FEET - 172 * .48;
    g.strokeStyle = SKY; g.lineWidth = 4; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = (t * 1.6 + i / 3) % 1;
      g.globalAlpha = Math.sin(a * Math.PI) * prog(t, L_STOP + .3, L_STOP + .6);
      g.beginPath(); g.arc(px, py, 20 + a * 26, Math.PI * .75, Math.PI * 1.25); g.stroke();
    }
    g.globalAlpha = 1;
  }
  g.restore();
  bubble(t, L_STOP + .3, 11.9, 'hey, welcome in! 👋', L_X + 62, FEET - 110, 'right');
  bubble(t, 13.1, 14.2, 'smooth. very smooth 😹', L_X + 62, FEET - 110, 'right');
}

// ---- right cat: plays with a ball, chases it, trips, plays it cool
const R_X = 1800, R_PLAY = 7.4, R_CHASE = 9.1, R_TRIP = 10.0, R_DOWN = 10.35, R_UP = 11.0;
const R_TRIP_X = 1720;
function ballPos(t) {
  // bounces in front of the sitting cat, then rolls left, bumps the fallen cat and stops
  if (t < R_CHASE) {
    const ph = ((t - R_PLAY) / .7) % 1;
    return [R_X - 105, FEET - 12 - Math.abs(Math.sin(ph * Math.PI)) * 60, 0];
  }
  if (t < R_DOWN) {
    const k = prog(t, R_CHASE, R_DOWN);
    return [R_X - 105 - k * 220, FEET - 12, -k * 14];
  }
  const k = easeOut(prog(t, R_DOWN, R_UP + .6));
  return [R_X - 325 + k * 60, FEET - 12, -14 + k * 3];
}
function drawBall(t, x, y, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = PINK; g.beginPath(); g.arc(0, 0, 14, 0, 6.28); g.fill();
  g.strokeStyle = ICE; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-14, 0); g.quadraticCurveTo(0, 10, 14, 0); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(-4, -5, 3.5, 0, 6.28); g.fill();
  g.restore();
}
function rightCat(t) {
  if (t < R_PLAY - .4 || !catImgs.sit) return;
  const fadeIn = prog(t, R_PLAY - .4, R_PLAY);
  g.save(); g.globalAlpha = fadeIn;
  const [bx, by, br] = ballPos(t);
  g.fillStyle = 'rgba(139,92,246,.35)'; g.beginPath(); g.ellipse(bx, FEET, 12, 3, 0, 0, 6.28); g.fill();
  if (t < R_CHASE) {
    // sitting, hopping in time with the ball
    const [im, w] = pick('sit', 160);
    const ph = ((t - R_PLAY) / .7) % 1, hop = Math.max(0, Math.sin(ph * Math.PI * 2)) * 8;
    shadowAt(R_X, w);
    g.translate(R_X, FEET - hop); g.rotate(-.05 * Math.sin(ph * Math.PI * 2));
    g.drawImage(im, -w / 2, -160, w, 160);
  } else if (t < R_TRIP) {
    // chasing the ball, facing left
    const x = R_X + (R_TRIP_X - R_X) * prog(t, R_CHASE, R_TRIP);
    const [im, w] = pick(walkFrame(t * 1.4), 152);
    shadowAt(x, w);
    g.translate(x, FEET); g.scale(-1, 1);
    g.drawImage(im, -w / 2, -152, w, 152);
  } else if (t < R_UP) {
    // trip: tips forward onto its face, lies there for a beat
    const k = easeOut(prog(t, R_TRIP, R_DOWN));
    const [im, w] = pick(walkFrame(R_TRIP), 152);
    shadowAt(R_TRIP_X - 30 * k, w * (1 + .4 * k));
    g.translate(R_TRIP_X - 50 * k, FEET); g.scale(-1, 1); g.rotate(1.25 * k);
    g.drawImage(im, -w / 2, -152, w, 152);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = fadeIn;
    if (t > R_DOWN) {
      // dizzy stars circling
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * 2.1, sx = R_TRIP_X - 130 + Math.cos(a) * 40, sy = FEET - 60 + Math.sin(a) * 12;
        g.fillStyle = i === 1 ? '#FFD36E' : ICE; g.font = '700 26px Inter'; g.textAlign = 'center';
        g.fillText('✦', sx, sy);
      }
      // dust puffs
      const dk = prog(t, R_DOWN, R_DOWN + .5);
      g.globalAlpha = fadeIn * (1 - dk) * .6; g.fillStyle = MUTED;
      for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(R_TRIP_X - 140 + i * 36 + (i - 1.5) * 30 * dk, FEET - 6 - dk * 20, 8 + dk * 10, 0, 6.28); g.fill(); }
    }
  } else {
    // pops back up, sits, plays it cool
    const [im, w] = pick('sit', 160);
    const k = prog(t, R_UP, R_UP + .3), sq = k < 1 ? 1 - .1 * Math.sin(k * Math.PI) : 1;
    const x = R_TRIP_X - 20;
    shadowAt(x, w);
    g.translate(x, FEET); g.scale(2 - sq, sq * (.6 + .4 * easeOut(k)));
    g.rotate(t > 12.2 ? -.05 * Math.sin((t - 12.2) * 3) : 0);
    g.drawImage(im, -w / 2, -160, w, 160);
  }
  g.restore();
  g.save(); g.globalAlpha = fadeIn; drawBall(t, bx, by, br * (t < R_CHASE ? 0 : 1)); g.restore();
  bubble(t, R_UP + .25, 12.15, 'oops… 🙈', R_TRIP_X - 78, FEET - 100, 'left');
  bubble(t, 12.2, 14.2, 'i meant to do that 😼', R_TRIP_X - 78, FEET - 100, 'left');
}

function catScene(t) { rightCat(t); leftCat(t); }

window.renderFrame = t => {
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0; g.filter = 'none';
  if (t < CITY) { boot(t); }
  else { city(t); nameSolid(t); kicker(t); details(t); catScene(t); rainFx(t); vignette(t); }
  // glitch cut from the boot screen into the city, and small hits on the title bursts
  if (t > BOOT_END - .15 && t < CITY + .35) glitch(t, 1 - Math.abs(t - CITY) / .5, 1);
  const tb = titleGlitchAmt(t);
  if (t > 4.3 && tb > 0) glitch(t, tb * .35, 7);
};
window.DURATION = DURATION;
buildCity();
window.ready = document.fonts.load('700 54px "JetBrains Mono"').then(() => document.fonts.load('800 30px "JetBrains Mono"')).then(() => document.fonts.load('500 34px "JetBrains Mono"')).then(() => document.fonts.load('italic 500 46px Inter')).then(() => document.fonts.load(NAME_FONT)).then(() => document.fonts.load('700 26px Inter')).then(() => document.fonts.load('600 22px "JetBrains Mono"')).then(loadCat);
</script>
