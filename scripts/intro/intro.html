<!doctype html>
<!--
  Cinematic intro for the profile README, drawn on a canvas one frame at a time.
  scripts/intro/render_intro.js loads this page, calls window.renderFrame(t)
  for every frame and turns the frames into assets/intro/hemashree-intro.{mp4,gif}.
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05070D}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="800"></canvas>
<script>
const W = 1920, H = 800, DURATION = 13;
const ROYAL = '#416AE6', SKY = '#839DFB', ICE = '#CEDAFF', SILVER = '#E6E9F0', MUTED = '#8E9BC0';
const NAME = 'HEMASHREE';
const ROLE = 'SOFTWARE ENGINEER';
const TAGLINE = 'Building systems that see, decide and keep people safe.';
const TAGS = ['COMPUTER VISION', 'SECURITY', 'BACKEND & DEVOPS', 'EMBEDDED & IoT'];
const HUD_L = 'VIT CHENNAI · B.TECH CSE';
const HUD_R = 'OPEN TO WORK';

const cv = document.getElementById('c'), g = cv.getContext('2d');

// ---------- helpers
let seed = 20261106;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// ---------- layout
const NAME_FONT = '800 168px Inter';
const NAME_Y = 330;
const NAME_X0 = W / 2, NAME_X1 = W / 2;          // name stays centred

// ---------- stars
const stars = Array.from({ length: 260 }, () => ({
  x: rnd() * W, y: rnd() * H, z: .2 + rnd() * .8, s: rnd() < .12 ? 2.2 : 1.2, p: rnd() * 6.28,
}));

// ---------- name particles: sample the rendered name
function sampleText(text, font, step) {
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const c = o.getContext('2d');
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.letterSpacing = '6px';
  c.fillStyle = '#fff'; c.fillText(text, W / 2, NAME_Y);
  const d = c.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
    if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  return pts;
}
const namePts = sampleText(NAME, NAME_FONT, 4).map(([x, y]) => {
  const a = rnd() * 6.28, r = 300 + rnd() * 900;
  return { tx: x, ty: y, sx: W / 2 + Math.cos(a) * r * 1.4, sy: H / 2 + Math.sin(a) * r * .6,
           d: rnd() * .9, sz: 1 + rnd() * 1.6 };
});

// ---------- scene pieces
function background(t) {
  g.fillStyle = '#05070D'; g.fillRect(0, 0, W, H);
  const fadeIn = prog(t, 0, 1.4);
  // nebula
  const neb = (x, y, r, col, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  };
  const drift = Math.sin(t * .35) * 40;
  neb(W * .62 + drift, H * .45, 820, 'rgba(65,106,230,A)', .20 * fadeIn);
  neb(W * .2 - drift, H * .6, 600, 'rgba(131,157,251,A)', .10 * fadeIn);
  neb(W * .85, H * .2, 500, 'rgba(143,227,200,A)', .04 * fadeIn);
  // stars with parallax drift
  for (const s of stars) {
    const x = (s.x - t * 14 * s.z + W) % W, tw = .45 + .55 * Math.sin(t * 2.2 + s.p);
    g.globalAlpha = fadeIn * s.z * tw;
    g.fillStyle = s.z > .8 ? ICE : SILVER;
    g.fillRect(x, s.y, s.s, s.s);
  }
  g.globalAlpha = 1;
}

function nameOffset(t) { return (NAME_X1 - NAME_X0) * easeInOut(prog(t, 4.2, 5.6)); }

function nameParticles(t) {
  const fade = 1 - prog(t, 3.1, 3.7);
  if (fade <= 0) return;
  g.fillStyle = SKY;
  const dx = nameOffset(t);
  for (const p of namePts) {
    const k = easeOut(prog(t, .8 + p.d, 2.6 + p.d * .5));
    const x = p.sx + (p.tx - p.sx) * k + dx, y = p.sy + (p.ty - p.sy) * k;
    g.globalAlpha = fade * (.25 + .75 * k);
    g.fillRect(x, y, p.sz, p.sz);
  }
  g.globalAlpha = 1;
}

function nameSolid(t) {
  const a = prog(t, 2.9, 3.6);
  if (a <= 0) return;
  const x = NAME_X0 + nameOffset(t);
  const pulse = 1 + .15 * Math.sin(t * 1.6);
  g.save();
  g.font = NAME_FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '6px';
  g.globalAlpha = a;
  g.shadowColor = ROYAL; g.shadowBlur = 70 * pulse; g.fillStyle = ROYAL;
  g.fillText(NAME, x, NAME_Y);
  const fill = g.createLinearGradient(0, NAME_Y - 70, 0, NAME_Y + 70);
  fill.addColorStop(0, '#A9BEFF'); fill.addColorStop(.45, '#5A80F0'); fill.addColorStop(1, ROYAL);
  g.shadowBlur = 22; g.shadowColor = '#2F55D4'; g.fillStyle = fill;
  g.fillText(NAME, x, NAME_Y);
  g.restore();
  // light sweeps across the name
  sweep(t, 3.4, 4.3, x);
  sweep(t, 10.9, 11.8, x);
}

function sweep(t, a, b, cx) {
  const k = prog(t, a, b);
  if (k <= 0 || k >= 1) return;
  const half = 560, sx = cx - half + 2 * half * easeInOut(k);
  g.save();
  // streak
  const gr = g.createLinearGradient(0, NAME_Y, W, NAME_Y);
  gr.addColorStop(0, 'rgba(131,157,251,0)');
  gr.addColorStop(clamp(sx / W), 'rgba(230,236,255,.9)');
  gr.addColorStop(1, 'rgba(131,157,251,0)');
  g.globalAlpha = Math.sin(k * Math.PI);
  g.fillStyle = gr; g.fillRect(0, NAME_Y - 1, W, 2);
  // flare
  const fl = g.createRadialGradient(sx, NAME_Y, 0, sx, NAME_Y, 120);
  fl.addColorStop(0, 'rgba(255,255,255,.95)'); fl.addColorStop(.15, 'rgba(131,157,251,.6)'); fl.addColorStop(1, 'rgba(65,106,230,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = fl; g.fillRect(sx - 120, NAME_Y - 120, 240, 240);
  // sheen over the letters
  g.globalCompositeOperation = 'source-atop';
  g.restore();
}

function details(t) {
  const cx = NAME_X1;
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  // underline
  const lk = easeInOut(prog(t, 4.6, 5.5));
  if (lk > 0) {
    const half = 470 * lk;
    const gr = g.createLinearGradient(cx - half, 0, cx + half, 0);
    gr.addColorStop(0, 'rgba(65,106,230,0)'); gr.addColorStop(.5, 'rgba(131,157,251,.95)'); gr.addColorStop(1, 'rgba(65,106,230,0)');
    g.fillStyle = gr; g.fillRect(cx - half, 435, half * 2, 2);
  }
  // role, revealed letter by letter
  const rk = prog(t, 5.0, 6.0);
  if (rk > 0) {
    g.font = '600 36px Inter'; g.letterSpacing = '16px';
    g.fillStyle = ICE; g.shadowColor = ROYAL; g.shadowBlur = 16;
    const n = Math.ceil(ROLE.length * rk);
    const full = g.measureText(ROLE).width;
    g.textAlign = 'left';
    g.fillText(ROLE.slice(0, n), cx - full / 2 + 8, 485);
    g.shadowBlur = 0;
  }
  // tagline, typed
  const tk = prog(t, 6.0, 7.7);
  if (tk > 0) {
    g.font = '400 30px Inter'; g.letterSpacing = '0px'; g.fillStyle = MUTED; g.textAlign = 'left';
    const full = g.measureText(TAGLINE).width, n = Math.floor(TAGLINE.length * tk);
    const x0 = cx - full / 2;
    g.fillText(TAGLINE.slice(0, n), x0, 545);
    if (t < 9.2 && Math.floor(t * 2.5) % 2 === 0) {
      const w = g.measureText(TAGLINE.slice(0, n)).width;
      g.fillStyle = SKY; g.fillRect(x0 + w + 4, 529, 3, 32);
    }
  }
  // tags
  g.font = '600 22px JetBrains Mono'; g.letterSpacing = '2px'; g.textAlign = 'center';
  const widths = TAGS.map(s => g.measureText(s).width + 44), gap = 18;
  let x = cx - (widths.reduce((a, b) => a + b) + gap * (TAGS.length - 1)) / 2;
  TAGS.forEach((s, i) => {
    const k = backOut(prog(t, 7.8 + i * .22, 8.3 + i * .22));
    if (k > 0) {
      const w = widths[i], y = 622 + (1 - k) * 30;
      g.globalAlpha = clamp(k);
      g.fillStyle = 'rgba(16,19,31,.85)'; g.strokeStyle = i === 0 ? ROYAL : 'rgba(65,106,230,.55)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect(x, y - 24, w, 48, 24); g.fill(); g.stroke();
      g.fillStyle = i === 0 ? ICE : SILVER; g.fillText(s, x + w / 2, y + 1);
    }
    x += widths[i] + gap;
  });
  g.globalAlpha = 1;
  // HUD corners
  const hk = prog(t, 8.7, 9.5);
  if (hk > 0) {
    g.globalAlpha = hk; g.font = '500 20px JetBrains Mono'; g.letterSpacing = '4px';
    g.textAlign = 'left'; g.fillStyle = MUTED; g.fillText(HUD_L, 60, 52);
    g.textAlign = 'right'; g.fillStyle = '#8FE3C8'; g.fillText(HUD_R, W - 60, 52);
    g.beginPath(); g.arc(W - 60 - g.measureText(HUD_R).width - 22, 52, 7, 0, 6.28);
    g.globalAlpha = hk * (.5 + .5 * Math.sin(t * 5)); g.fill();
  }
  g.restore();
}

function vignette(t) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .55, W / 2, H / 2, W * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // letterbox bars ease in, and the whole thing fades to black for a clean loop
  const out = prog(t, 12.3, 13);
  if (out > 0) { g.fillStyle = `rgba(5,7,13,${out})`; g.fillRect(0, 0, W, H); }
}

window.renderFrame = t => {
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0;
  background(t);
  nameParticles(t);
  nameSolid(t);
  details(t);
  vignette(t);
};
window.DURATION = DURATION;
window.ready = document.fonts.load(NAME_FONT).then(() => document.fonts.load('600 22px "JetBrains Mono"'));
</script>
</body></html>
